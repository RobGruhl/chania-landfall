<script>
const STOPS = {"rob":[{"n":1,"slug":"souda","title":"The Bay Talos Guarded","short":"From here you look out on Souda Bay, about 15 km of deep, sheltered water tucked behind the Akrotiri peninsula. Cretan myth had a guardian for coasts like this: Talos, the bronze giant who circled the island three times a day and stoned strange ships. Today the wind did his job and sent your ship here instead of Mykonos. The Venetian fortress islet at the mouth held out until 1715, seventy years after Chania fell, and in May 1941 this was the shore of the Battle of Crete, where the war cemetery now sits. Warships still anchor across the water. Chania itself is about 7 km west, and the Agora is your first stop.","long":"In the Argonautica, written by Apollonius of Rhodes in the 3rd century BC, the Argo comes within sight of Crete and cannot land, because Talos is on watch. He is the last of the bronze race, a gift from Zeus to Europa (in other versions, forged by Hephaestus for King Minos), and he runs the island's coast three times a day, throwing rocks at anything that approaches. His one weakness is a single vein at the ankle, closed by thin skin. In the poem Medea ruins him with the evil eye and phantoms, so that he scrapes the ankle on a rock and the ichor runs out of him like molten lead. All of this is myth, and a good one to carry into a harbour, especially since two days ago in Rhodes you went looking for that island's bronze giant, the one that stood, while Crete's was the one that ran.\n\nThe wind has done his work today, and what it brought you to is worth the detour. Souda Bay runs about 15 km long and is usually counted among the largest and deepest natural harbours in the Mediterranean, with the Akrotiri peninsula as a breakwater to the north. Ships have always come here when the weather turns, and the Venetians understood its value better than anyone. They built a fortress on the small island at the bay's mouth, mostly in the 1570s (the dates aren't firm), to control the way in.\n\nThe fortress has the best siege story in the bay. When Chania surrendered on 22 August 1645, the Venetian garrison and the townspeople who chose to leave were ferried out here unharmed, and Souda held out along with Gramvousa and Spinalonga. Venice kept all three even after giving up Candia in 1669, as a foothold for the day it might retake the island. It never did, but Souda flew the Lion of St Mark until 1715, in the Ottoman-Venetian war of 1714 to 1718: 70 years after Chania fell and 46 after Candia. Under Ottoman rule the islet later served as a refuge for Cretan insurgents, so that a rock which spent seventy years as a Venetian outpost inside enemy territory ended up sheltering rebels.\n\nThe 20th century gave the bay its next layer. On 26 March 1941, Italian explosive motor boats of the Decima Flottiglia MAS slipped in at night and crippled the heavy cruiser HMS York at anchor, and she was beached and later bombed by the Luftwaffe. Two months later came the Battle of Crete, 20 May to 1 June 1941, the first largely airborne invasion in history, code-named Operation Merkur; its decisive point was Maleme airfield, west of Chania, but the bay was part of the same fight.\n\nThe Commonwealth war cemetery sits on the shore about 1.5 km north-west of the port, and its figures are sobering. It holds 1,564 burials, roughly 860 British, 446 New Zealanders, 197 Australians and a few South African, Canadian and Indian, and more than half of the Second World War graves are unidentified. If the weather lets you and your day has room for it, a quiet minute there is a fair thing to give; if not, it is enough to know it lies on the shore you are passing.\n\nToday the bay is still a military harbour, with Hellenic Navy facilities, a US Naval Support Activity and a NATO pier sharing the water, so you may see grey hulls across the way. A campaign designer might call it a neutral port with too many factions, which is roughly what it has been for 500 years. Nearly everyone in Chania's story arrived by this water or was evacuated through it, from Minoan merchants and Venetian galleys to Ottoman fleets, Royal Navy cruisers and, today, a cruise ship with a wind problem.\n\nThe shuttle or the line 13 bus takes about 25 minutes to cover the 7 km along the shore into town, and the islet at the mouth is worth watching for on the way. You will be set down near the Agora, the big cross-shaped Market Hall, which stands on the stump of a Venetian bastion and is your first stop."},{"n":2,"slug":"agora","title":"Groceries on the Guns","short":"This is the cross-shaped Market Hall, built 1911 to 1913 and today closed for restoration (reopening is announced for December 2026, so this is an outside view). It stands on the remains of a Venetian bastion, the Piatta Forma, part of the walls designed to keep the Ottomans out, and Eleftherios Venizelos opened it on 4 December 1913, three days after Crete's union with Greece. Chania's whole history is layered here, from Minoan, Roman and Byzantine through Venetian, Ottoman, Egyptian and Cretan State to Greek. Walk north-east about 7 minutes to Splantzia, the old Muslim quarter, and a church that changed sides.","long":"The roofline is a cross, with four wings and an entrance facing each compass point, said to be modelled on the covered market of Marseille. It was begun in 1911 and opened on 4 December 1913 by Eleftherios Venizelos, then Prime Minister of Greece and a local boy from Mournies, just outside Chania. It is closed today for restoration, with reopening announced for December 2026, so you will be reading it from the street.\n\nThe market stands on the remains of the Piatta Forma, a Venetian bastion on the line of the city's eastern walls, and part of the walls and the bastion were demolished to make room for it. A stone artillery platform built to keep the Sultan's army out was thus replaced by a hall for cheese and fish, which says a good deal about what the city wanted once the fighting was over and the people had won the right to shop.\n\nChania has been several towns on the same ground. Under the hill north-east of here, which you reach shortly, lay Minoan Kydonia, followed by Greek and Roman Kydonia (Rome took Crete in 69 BC) and then Byzantine rule. There was an interruption: from 824 to 961 Crete was an Arab emirate, until the Byzantines under Nikephoros Phokas took it back and built a fortress on that hill against a second Arab invasion. After 1204 Crete passed to Venice, and in 1252 Venetian colonists founded La Canea on the ancient site, where they stayed until 1645.\n\nThe Venetian city needed walls, and the walls are why the market stands where it does. From the late 1530s to 1568 new fortifications went up, designed by Michele Sanmicheli, one of the great military engineers of his day, with angled bastions, ditches and clear firing lines that a dungeon master would envy. They fell anyway, in 1645, after a 56-day siege (27 June to 22 August), and you meet the siege properly at the harbour mosque later.\n\nOttoman rule followed, 1645 to 1898, with one odd interruption: from 1830 to 1840 Crete was held by Mehmet Ali's Egypt, a reward for helping the Sultan against the Greek revolution, before it went back to direct Ottoman rule. Revolts came in 1866 to 1869, 1878, 1889 and 1895 to 1897, and in 1898 the Great Powers helped set up the autonomous Cretan State, with Chania as its capital. The last move came on 1 December 1913, when the Greek flag went up at the Firkas fortress and Crete joined Greece, and three days later Venizelos was here cutting the ribbon. A market in this style, in this place, was a statement that Chania was now a modern Greek city with proper stalls and civic pride, and it remained the capital of Crete until 1971, when the seat moved to Heraklion.\n\nThe list of those who have held the town therefore runs from Minoans, Greeks, Romans, Arabs and Byzantines to Venetians, Ottomans, Egyptians, the Cretan State and Greece, and you will see traces of most of them in the next hour or two. It is worth naming, for each wall, dome or vault you pass today, who built it and who took it over.\n\nTraditionally the wings were divided by trade, with butchers, fishmongers, greengrocers, and cheese and herb sellers, and 76 shops grouped around the arms. If showers start, this is a good moment to peer through the gates and move on, since the outdoor stops are better done first today.\n\nFrom here walk north-east about 7 minutes through the grid of streets to Splantzia, the old Ottoman Muslim quarter, where a plane tree with a dark legend stands near a church with a minaret and a bell tower on the same building. The minaret shows over the rooftops, so aim for it."},{"n":3,"slug":"splantzia","title":"A Church That Changed Sides","short":"You are in Plateia 1821, Splantzia, once the heart of Chania's Muslim quarter, where the church of Agios Nikolaos was built around 1320 as a Dominican church, became the sultan's mosque (Hunkar Camii) after 1645, and was reconsecrated Orthodox in 1918. It still carries both a minaret and a bell tower. The big plane tree is tied to a hanging story that is local legend and unverified. Coffee or raki at Platanos is the classic way to spend a few minutes here, with the church's two towers in view. Then walk about 4 minutes west, uphill, to Kastelli.","long":"The church of Agios Nikolaos on the square has two towers, a tall cylindrical minaret of about 36 m and a bell tower added in the 1950s, and it is reportedly the only building in Greece with both. Together they read like a faction map in stone.\n\nAbout 1320 the Dominicans of Candia built it as a Catholic monastery church, since Chania was a Venetian colony and the friars were part of its order. After the fall of the city in 1645 the Ottomans turned it into a mosque, one of three churches converted straight after the conquest, and named it the Hunkar Camii, the Sovereign's Mosque, in honour of Sultan Ibrahim, who had launched the Cretan war. The minaret comes from that period and would have stood taller, over 40 m, with its lost conical cap. In 1918 the building was reconsecrated as an Orthodox church dedicated to St Nicholas, so that three owners have left their evidence in one set of walls.\n\nThe square itself is called Splantzia, from the Venetian word for piazza, and under the Ottomans it was the heart of the Muslim quarter of Chania, with Topanas, to the west, as the Christian quarter. Many of Chania's Muslims were Cretan converts who spoke Greek, so the line between the quarters ran along religion and administration rather than language, and the population also included Orthodox Christians, a Jewish quarter, and later Egyptian and Western merchants and consuls. It was a city of several communities with a garrison on top.\n\nA large plane tree stands in the square, and local tradition ties it to the hanging of Orthodox clergy and rebels under the Ottomans. The name most often given is Melchisedek Despotakis, bishop of Kissamos, said to have been hanged here in 1821, the first year of the Greek revolution. The story is widely repeated and fits the year, but the sources only call it local tradition, so it stays unverified and is best taken as a hook rather than a fact, a place where the authorities made examples. Anyone curious could try to find out what the records actually say.\n\nAnother tradition holds that the little church of Agioi Anargyroi nearby was the only church where Orthodox worship was allowed in Ottoman Chania, which is also unverified and sounds a little too neat to rest on.\n\nWhat is firmly documented is the ending. After 1923 and the Treaty of Lausanne most Cretan Muslims left in the population exchange to Anatolia, and their houses here were taken by Orthodox refugees from Asia Minor. When a historian says the exchange emptied Splantzia, this is what is meant, which is to say that families who had lived here for generations were exchanged for others who did not know the place at all, and the quarter changed its population almost overnight.\n\nToday the square is the best place in Chania to sit down. The tavernas under the plane tree, with Platanos as the classic, will serve you coffee or a raki, and if it rains the awnings are well used to it. From a table you can see the Catholic, Ottoman and Orthodox layers without moving your head.\n\nNext, about 4 minutes west and uphill, is Kastelli, the low hill behind the harbour, where the streets narrow and the surface changes. There you will look through fences at something much older than any of this, the town the Minoans burned and the clay tablets the fire baked."},{"n":4,"slug":"kastelli","title":"The Town Under the Hill","short":"Kastelli is the low hill above the harbour, and under its streets lies Minoan Kydonia, which you can see through the fences on Kanevaro Street and at Agia Aikaterini square. A fire around 1450 BC destroyed the town and baked its clay archive hard, and the finds include the Master Impression, a sealing of a giant figure over a walled sea-town, and a Linear B tablet recording honey for Zeus and Dionysos. Byzantine and Venetian walls sit on top of it all. From here walk down about 4 minutes to the Neoria, the Venetian shipyards on the east harbour.","long":"Looking through the fence at Agia Aikaterini square and Kanevaro Street, you see a section cut through a town, with stone walls at several levels, floor plans, and a protective roof built in 2005 to 2008. This is Minoan Kydonia. People lived on Kastelli hill almost continuously for about 5,000 years, with one gap of roughly 1150 to 735 BC. The digs began as rescue work under Yannis Tzedakis in 1964 and became the Greek-Swedish excavation in 1970, and they showed that western Crete had a major Minoan centre.\n\nA fire around 1450 BC (sources give anywhere from 1480 to 1425) swept Kydonia as part of a wave of destruction across Crete that ended the world of the great Neopalatial towns. In one kitchen archaeologists found a clay hearth with a loom beside it and a jar holding about 3 kg of charred lentils and vetch, and the same fire baked the clay tablets in the archive hard enough to survive. Kydonia produced roughly 97 to 99 Linear A tablets, the second-largest archive of that undeciphered script after Hagia Triada, found in 1973; most record crops and livestock, though the language remains unread.\n\nThe best-known find is the Master Impression, a clay sealing a few centimetres across from the second half of the 15th century BC, stamped by a gold signet ring that has never been found. The picture shows a towering long-haired male figure in a kilt, holding a staff or spear, standing over a multi-storey complex with windows, horns of consecration and gates, on a rocky shore by the sea. Scholars disagree whether he is a king, a god, or a ruler shown as divine, and some read the town as Kydonia itself, which is possible but unprovable. The town is walled, which sits awkwardly with the old idea of a peaceful, unfortified Minoan Crete, though that \"Minoan peace\" is contested, and so is the claim that the Minoans were ruled by women, so it pays to be sceptical of both. It is a hard image to beat: a giant looming over a harbour town while no one has the ring.\n\nAfter the fire the story keeps going. Knossos came under Greek-speaking rulers writing Linear B around 1450, and the same script turns up here. Five Linear B tablets were found at Agia Aikaterini in 1989 and 1990, dated to the 13th century BC, which makes Chania one of very few places on Crete with Linear B tablets, along with Knossos and Malia. One of them, KH Gq 5, records honey, reading roughly di-we for Zeus, one amphora, and di-wo-nu-so for Dionysos, two amphorae, so that both gods are named and Dionysos gets more honey, some 800 years before classical Greek drama. Whether that proves anything about their relationship is speculation, and Dionysos also turns up at Pylos. The name Kydonia, written ku-do-ni-ja, is certainly attested on tablets from Knossos, but nothing says a tablet found here names the town.\n\nThe town lived on in memory as well. Homer's Odyssey names the Kydonians twice and has Menelaus's ships wrecked on Crete near their coast on the way home from Troy, and Strabo ranks Knossos, Gortyn and Kydonia as the three most notable cities on the island. The Greeks called the quince the Kydonian apple, which gave English the word quince, though some linguists suspect a pre-Greek word got attached to the town. The myths give the town a founder, King Kydon, whose parentage varies with the storyteller, who makes him a son of Hermes or Apollo and a daughter of Minos, or of an Arcadian, or has Minos himself do the founding. The Minotaur and the Labyrinth are at Knossos, not here.\n\nLater powers built on top of all this. A Byzantine fortress went up here in the 10th century to hold off a second Arab invasion, and parts of its wall survive. Venice's Castello followed, a walled upper town with the Rector's palace and the Latin cathedral, while ordinary townsfolk lived outside it until the new walls of 1536 to 1568 enclosed them. Bombing in May 1941 left the open lots that made digging possible.\n\nThe fence is the view, since the objects are in the museum, your afternoon stop. From here walk down about 4 minutes to the east harbour and the Neoria, the Venetian shipyards, long stone sheds where galleys were hauled in, one of which now holds a Bronze Age ship."},{"n":5,"slug":"neoria","title":"Dragon Lairs for Galleys","short":"These are the long, arched stone sheds on the harbour edge, the Venetian Neoria, shipyards where galleys were hauled in to be built and wintered. Seventeen stand on the south side, with the Moro yards to the east, and sources say 22 or 23 in all. When the Ottomans took the city in 1645 they found galleys still inside. One Moro shed now holds the Minoa, a lashed Bronze Age ship replica rowed to Piraeus in 2004. From here follow the breakwater about 10 minutes to the lighthouse, weather and spray permitting.","long":"Each arch is the open seaward end of a long vaulted hall, about 50 m long, 9 m wide and 10 m high. Arched openings in the side walls link one hall to the next, so a galley could be hauled in stern first, out of the weather and out of sight. Dragon lairs is not a bad name for them.\n\nThe Neoria were the working heart of Venetian Chania. The first two were finished in 1526, there were 16 by 1593, and the 17th completed the south range in 1599, after which five more, the Moro shipyards, went up on the east side a few years later. That gives about 22 in all, though some sources say 23, so neither number should be taken as settled. They were used to build, repair and over-winter the galleys of Venice's Cretan squadron, and in the storm season they must have been crowded with hauled-up oared warships, with carpenters, caulkers and rope-makers working in the dark. A row of 7 survives together, and one more stands further west, the Grand Arsenal, now the Centre of Mediterranean Architecture, which is free to look at and open on weekdays until about 15:00 when an exhibition is on.\n\nOn 22 August 1645, after 56 days of siege, the city surrendered, and when the Ottomans walked into the arsenal they captured 12 galleys, still sitting in their sheds in a city that had just fallen. Souda, across the bay, was still Venetian, and ships were the one thing that could still have linked the two, which makes it a fair puzzle why they had not been put to sea.\n\nThe sheds kept finding work after that, first as Ottoman and Egyptian military stores and later as 20th-century warehouses and workshops. The upper storey of the Grand Arsenal is a 19th-century addition, so the building kept going long after the fleet it served had gone.\n\nOne of the Moro sheds, at the east end of the harbour, houses the Minoa, a branch of the Maritime Museum of Crete, whose annex is open until 31 October and costs about 3 euro. The Minoa is a replica of a 16th to 15th century BC Minoan ship, about 17 m long and about 4 m wide. It was built from 2001 to 2004 with split cypress planks lashed and sewn together rather than nailed, and fitted with oars and a single square sail. The design drew on ship images such as the Akrotiri flotilla fresco and Minoan seals. It was launched in December 2003, and in 2004 it was rowed and sailed about 210 nautical miles from Chania to Piraeus for the Athens Olympics, where it met the Olympic flame, carried on the last leg by the trireme Olympias.\n\nSeen side by side, the two ships trace a long arc of the sea. On the hill just up the street where the Master Impression was found, a Minoan town stood on a rocky shore, with ships we know only through paintings and seals. Here a modern crew has made its best guess at one, while 3,000 years later Venice's galleys filled the sheds you are standing in front of. Minoan sailors, Venetian oarsmen, Ottoman crews and Royal Navy ships in Souda all shared the one constant of the island, the sea, and the powers that held it have mostly been trying to control who sails on it.\n\nThe Minoa also offers a gentle correction to the legend of Talos, who was said to protect Crete by stoning approaching ships. The Minoa did the opposite and sailed out, with a crew who rowed to Athens, which can be read as a modern answer to the giant.\n\nIf the weather is rough, spend your time inside the Moro shed, which is dry, and give the breakwater a miss. If it is calm enough, the next stop is a walk out along the breakwater, about 10 minutes, to the lighthouse at the harbour mouth. It is a defence the city has used for centuries, and the tower is what Chania looks like to ships coming in. Skip it if the stone is wet and spray is coming over."},{"n":6,"slug":"lighthouse","title":"The Minaret for Ships","short":"You are at the end of the breakwater, or as near as the weather lets you get, in front of the Egyptian lighthouse, with its octagonal base, 16-sided middle and round top that people have always said resemble a minaret. Venice put a light here in the late 16th century and the Ottomans let it decay; the present tower is a 19th-century rebuild, dated to about 1839 under Egyptian rule by local accounts and to 1864 by others. From here the whole waterfront lies in front of you like a map, though if spray is coming over the stones you can look from the shore instead. Next is the domed mosque, about 15 minutes back along the breakwater and round the harbour.","long":"Stand where the breakwater runs out and turn your back to the sea, or, if the stones are wet and spray is coming over, do the same from the shore end, where the view is nearly as good and nothing is worth a fall. The tower beside you is the Chania lighthouse, and the sea-wall under your feet is the line that has kept the weather off the harbour for four hundred years.\n\nVenice built the first light here in the late 16th century, usually dated 1595 to 1601, just as the harbour and the shipyards behind you were taking their final shape, and after the Ottomans took the city in 1645 it fell into neglect. The tower you see is a rebuild, and the sources disagree about when. Local and tourism accounts credit the Egyptians, who held Crete from 1830 to 1840 under Mehmet Ali, and date it to about 1839, which is why it is called the Egyptian lighthouse; other sources say it was rebuilt in 1864. Both agree it is a 19th-century tower, and neither date is safe enough to carve in stone, any more than the height, which is about 21 metres in some sources and 26 in others.\n\nThe shape is not in dispute. An octagonal base, a 16-sided middle section and a round top, with a stone stair inside, gave people the same thought at once: it looks like a minaret. It seemed a prayer tower pointed at the sea, standing guard over a Christian harbour that had been Ottoman for nearly two centuries. Whoever built it, the outline carries a small piece of the city's whole story in one profile. It was made an official Greek lighthouse in 1915, damaged in the Second World War, listed as a monument in 1962 and refurbished in 2005 and 2006, and today it flashes red every two and a half seconds.\n\nLooking back from here, the whole waterfront is laid out in front of you. You can see the domed mosque on the quay, the long vaults of the Neoria, Firkas at the far end of the harbour, the Venetian walls, and behind them the hill of Kastelli where you stood this morning. Every power that wanted this island needed a harbour, and you are looking at the reason they all came. Weather like today's is exactly what the sea-wall was built for, and Bronze Age sailors, Venetian galley crews and cruise ships diverted from Mykonos have all run for shelter on this coast when the north wind came up.\n\nLooking west across the gulf on a clear day, you can pick out the long arm of the Rodopou peninsula, where the sanctuary of Diktynna, the goddess of nets, once stood. In the myth, Britomartis, a nymph of the hunt, was pursued by King Minos for nine months until, cornered on a cliff, she jumped into the sea and was caught in fishermen's nets. The grateful islanders made her a goddess, and Strabo derives the name Diktynna from diktyon, a net. Her temple at Rodopou was rebuilt under Hadrian, but the oldest finds there date only to the late 7th or 6th century BC, so it is not a proven Minoan site, and whether she had Minoan roots is plausible but unproven. A goddess who answers a drowning person with a fisherman's net is still a fitting patron for this wall, and a party heading out to sea could do worse than to claim her.\n\nYou have walked the whole length of the harbour to stand here, so leave the tip to the wind. Walk back along the breakwater, keep the water on your right as you go round the harbour front, and in about 15 minutes you reach the low grey domes of the mosque on the quay."},{"n":7,"slug":"mosque","title":"The Pirate Raid and the Pasha","short":"You are facing the domed mosque on the quay, Kioutsouk Hasan, also called Yiali Tzamisi, the Seaside Mosque. Built from 1645, right after the Ottoman conquest, it is usually called the oldest surviving Ottoman building on Crete, and it carries the name of Küçük (\"Little\") Hasan Pasha, given as the first Ottoman commander of the city. The minaret was lost in the 20th century and the mosque opens only for exhibitions, so you may see it only from outside. The war that put it here began with a pirate raid by the Knights of Malta in 1644; the siege of Chania lasted about two months, though the larger war ran 24 years. Next is Firkas, about 5 minutes west along the harbour.","long":"The building in front of you is a squat grey mass of domes at the water's edge, with a large central dome on four great arches and a row of smaller domes over the porch. Sources count six or seven of those, so do not take anyone's number on trust. This is the Kioutsouk Hasan mosque, also called Yiali Tzamisi, the Seaside Mosque, or the Mosque of the Janissaries. It was built from 1645, in the first years after the Ottoman conquest (some sources say 1645 to 1649), and is usually called the oldest surviving Ottoman building on Crete. Tradition says an Armenian architect designed it, though that is only tradition. The minaret was demolished in the 20th century, in the 1920s or by 1939 depending on the source, and the mosque opens mostly for exhibitions, so you will probably be looking at it from the quay, although a sign on the door may say otherwise.\n\nIt works as a victory banner in stone, since the Ottomans put their first new mosque on the quay where Venetian galleys had tied up, in full view of everyone entering the harbour. The reason goes back to 1644, when the Knights of Malta, the same order you met on Rhodes after they lost it, captured an Ottoman ship carrying, among others, a member of the Sultan's harem, and then put in at Crete. Sultan Ibrahim blamed Venice, and the combination of sea-going crusaders, a captured ship and an enraged sultan, which sounds like an adventure hook, started a war.\n\nThe Ottoman fleet left Istanbul on 30 April 1645 under Silahdar Yusuf Pasha, reached Chania on 23 June, and began the siege proper on 27 June. The sources give about 50,000 men, among them 7,000 Janissaries, 14,000 sipahis cavalrymen and 3,000 sappers, carried on some 416 ships, a few of them hired Dutch and English vessels. Against them stood roughly 12,000 Venetian defenders, described as an inadequately recruited militia, behind the bastioned walls Sanmicheli had designed a century earlier. Chania held 56 days and surrendered on 22 August 1645, though some sources say 54 or 57 days, depending on how they count.\n\nThe best story of the siege happened offshore, at the islet fort of Agioi Theodoroi, which was held by Blasio Zulian with about 30 men. According to the account, when the end came he refused to hand the place over and set mines in the fort, blowing up himself, his men and the fortress. Call it Crete's Alamo if you like, though it is closer to a doomed rearguard making sure the other side got nothing.\n\nThe Venetian garrison and the townspeople who chose to leave were evacuated unharmed to the island fortress of Souda, the one you passed on the way in, while the Ottomans walked into the Venetian arsenal and found 12 galleys still sitting in their sheds. Three churches became mosques at once, and Istanbul fired its cannon for three days in celebration. A Christian relief force of Tuscan, Spanish, Papal and Maltese ships arrived too late and failed in a counterattack on 1 October. Yusuf Pasha left a garrison of 8,000 behind and by most accounts was executed in Istanbul in early 1646 after quarrelling with the Grand Vizier.\n\nChania was only the opening of the Cretan War, which ran from 1645 to 1669 and reached its great set piece at the siege of Candia, modern Heraklion, which lasted about 21 years and is often called one of the longest sieges in history. Francesco Morosini surrendered it in September 1669, and Venice kept only three island fortresses, Souda, Gramvousa and Spinalonga, of which Souda held out until 1715. Chania's 56 days set against Candia's 21 years mark the difference between a militia behind a wall and a whole continent's mercenaries paying for every metre.\n\nThe building had a long second life afterwards. Following the 1923 population exchange it served as a warehouse, then as the town's archaeological museum, then as a tourism office, and it now belongs to the Port Fund. Walk west along the harbour front, past the cafes, with the fortress ahead of you, and in about 5 minutes you reach Firkas."},{"n":8,"slug":"firkas","title":"The Flag Over the Barracks","short":"You are at Firkas, the Venetian bastion at the west mouth of the harbour, built around 1620. Its name comes from the Turkish firka, barracks, which is what it became under the Ottomans, along with a prison. On 1 December 1913 the Greek flag went up here to mark Crete's union with Greece, after a rebellion that began in 1866. The Maritime Museum of Crete now sits at its entrance (09:00 to 17:00, 4 euros), with Bronze Age ship models, Venetian galleys and the Battle of Crete, and it is the place to go in if the sky opens. Next is Topanas and the old Jewish quarter, about 5 minutes south.","long":"You are standing at the harbour's western gate. Firkas was built around 1620 to guard the harbour mouth, next to the San Salvatore bastion at the north-west corner of the walls. Its name is Turkish, firka, meaning barracks, because that is what it became after 1645, a garrison post and a prison whose guns over the harbour belonged to the Sultan's soldiers. It was here, nearly three centuries later, that the Ottoman story on Crete formally ended.\n\nThe union with Greece was proclaimed on 1 December 1913, on the legal basis of the Treaty of London of 30 May 1913, under which the Ottoman Empire gave up its rights to Crete. On that morning the Greek flag was raised over Firkas in the formal ceremony. The sources say King Constantine and Eleftherios Venizelos attended, and the date and the place are well established. Three days later Venizelos opened the new Municipal Market, which you saw this morning, built on the stump of a Venetian bastion.\n\nBehind that flag lie 47 years of trouble. The Great Cretan Revolt of 1866 to 1869 is remembered above all for Arkadi Monastery near Rethymno. There in November 1866 the defenders blew up their own powder store rather than surrender, the same choice Blasio Zulian had made at the islet fort in 1645, two centuries earlier. More risings followed in 1878, which produced the Halepa Pact and limited home rule, and again in 1889 and in 1895 to 1897. Each time the island's villages emptied into the hills and the monasteries, so that almost every family had someone in the mountains.\n\nIn February 1897 insurgents raised the Greek flag on Profitis Ilias, the hill on the Akrotiri peninsula that you can see across the bay, and foreign warships shelled them. The famous story says the flagpole was shot away and a fighter named Spyros Kayales held the flag up himself until the admirals stopped firing out of respect. It is best treated as legend, since the shelling is better documented than the man with the flag. The Great Powers, Britain, France, Russia and Italy, occupied the island and in 1898 set up the autonomous Cretan State with Chania as its capital. That made the town an international place full of consuls and gunboats, and Prince George of Greece landed as High Commissioner in December 1898.\n\nVenizelos, born in 1864 at Mournies just outside Chania, led the Theriso revolt against Prince George's rule in 1905, and George resigned in 1906. By 1910 Venizelos was in Athens, and he went on to serve as Prime Minister of Greece for a long run of terms. A rifle-carrying rebel in the hills in 1905 was head of the Greek government five years later, a rise that a campaign designer would hesitate to give a rogue. He died in Paris in 1936 and is buried on Akrotiri, on the hill of Profitis Ilias, looking down on the city. Chania stayed the capital of Crete until 1971, when the title passed to Heraklion.\n\nThe Maritime Museum of Crete is here too, and worth entering, or at least approaching, if the weather turns. It was founded in 1973 and is open 09:00 to 17:00, 4 euros, with three permanent exhibitions on the marine environment, the Battle of Crete in 1941, and ancient and traditional shipbuilding, so expect Bronze Age ship models, Venetian galleys and the 1941 gallery. It also closes the museum's long run along the harbour, since the Minoa, the ship you looked at this morning, now sits in one of the Moro shipyards at the far end, so you have seen both ends of the collection.\n\nWalk about 5 minutes south from Firkas, away from the water and into Topanas, which the Venetians knew as the nobles' quarter and which later became the Christian quarter. Just beyond it, in the streets around Kondylaki, was the Jewish quarter, Evraiki, and the next stop is a quiet one."},{"n":9,"slug":"synagogue","title":"Etz Hayyim","short":"You are in the lane outside Etz Hayyim synagogue, on Parodos Kondylaki, in what was Evraiki, the Jewish quarter of Chania; it is open today until 15:00 and costs 4 euros, with a short tour from the staff. It was built as a church in the Venetian period and became a synagogue in the 17th century. On 29 May 1944 the Germans arrested the Jews of Chania, and on 9 June the ship carrying them, the Tanais, was sunk by a British submarine that did not know who was aboard. The synagogue was restored and reopened in 1999, and visitors are asked to photograph only the building. Lunch is two minutes away, and then a taxi east.","long":"The lane you are standing in is Parodos Kondylaki, in the part of Chania that was known as Evraiki, the Jewish quarter, and the building in front of you is Etz Hayyim. It is open today until 15:00, the entrance is 4 euros and includes a short tour by the staff, and photographs are of the building only, since it is a quiet place and deserves to be treated as one.\n\nThe building was a church in the Venetian period and became a synagogue in the 17th century, after the Ottoman conquest. Jews had lived on Crete for a very long time, and the community that worshipped here was Romaniote, with roots on the island going back to antiquity, neighbours for centuries of Christians and Muslims in the streets around the synagogue.\n\nThat life together ended in 1944, when on 29 May the Germans rounded up the Jews of Chania, about 250 to 275 people, though another account gives 276 arrested on 20 May, so the date and the figure are not settled. They were taken by truck to Heraklion and put aboard the steamer Tanais, along with Greek hostages, resistance prisoners and Italian prisoners of war. The Tanais had already been sunk once, by the Luftwaffe in Souda Bay on 26 May 1941, and then raised and repaired.\n\nOn 9 June 1944, about 14 nautical miles north-west of the islet of Dia, the British submarine HMS Vivid fired four torpedoes from 2,400 yards, and two hit, sinking the ship in about 12 seconds. The crew of the Vivid did not know who was aboard. Estimates of the dead run from 425 to 1,000, and sources do not agree on the figure; about 265 were Cretan Jews, and the rest were up to 400 Greek prisoners and between 100 and 300 Italian prisoners. The sinking ended the Jewish community of Crete, and Chania remembers the victims every June, with a memorial in the city.\n\nThe synagogue itself survived as a ruin, and in the late 1990s it was restored under the leadership of Nikos Stavroulakis and reopened in 1999. In January 2010 it was attacked twice by arsonists, on 5 and 16 January, and the second fire destroyed about 2,500 rare books and manuscripts, after which the congregation repaired it again. Today it is run by a mostly non-Jewish congregation that follows Sephardic customs and has written its own Haggadah, and Queen Sofia of Spain and the former King Constantine II visited unannounced in March 2006. The building has been kept alive by people who are not descended from the families whose names are remembered on its wall.\n\nInside you will find a courtyard and a garden, and a plaque with the names of the deported. Take the staff tour if one is starting, since it is short and the people who give it know the building better than anything written here, and the names on the plaque need no commentary.\n\nWhen you come out, take your time before lunch at Tamam, on Zambeliou Street in an old hammam, about two minutes away; it is indoors and serves Cretan and Ottoman cooking, which suits a day of showers. After lunch, take a taxi east to the Archaeological Museum at Chalepa, since it is about 25 minutes on foot, which is too much in this weather."},{"n":10,"slug":"museum","title":"Tablets, Honey and a Ring","short":"You are at the Archaeological Museum of Chania at Skra 15 in Chalepa (08:00 to 20:00, 15 euros with audio guide), the end of the day. Among the finds are the Linear A and Linear B tablets from Kastelli and the Master Impression, a clay lump a few centimetres across that shows a giant over a walled sea-town, made by a ring that has never been found. Chalepa itself was the consuls' quarter of the Cretan State. When you are done, the easiest way back to the ship before 18:00 is a taxi to Souda, and with the weather bad and the roads busy you should allow plenty of time.","long":"This is the last stop. The museum opened here, at Skra 15 in Chalepa, on 16 April 2022, and the old museum in the Venetian church of San Francesco on Chalidon Street no longer holds the collection, so do not send anyone there. The new building is by Theophanis Bobotis and partners, about 6,000 square metres and triangular, emerging from the hillside and pointing towards the sea, with more than 4,100 objects on show. It is open from 08:00 to 20:00 until the end of October, closed on Tuesdays, and the ticket is 15 euros with an audio guide; the last entry is 20 minutes before closing, and the floor plan at the desk shows which room holds what.\n\nChalepa is worth a thought as well, as the elegant district of the Cretan State, the quarter of the consuls and of Prince George, where Venizelos's house is.\n\nAmong the small things, the Master Impression comes first, if it is on show. It is a clay sealing from Kastelli, dated to the second half of the 15th century BC and only a few centimetres across, stamped by a gold signet ring that has never been found. It shows a tall figure with long hair, a kilt and a staff or spear, standing over a multi-storey complex of windowed buildings with horns of consecration, on a rocky shore, behind walls with gates. Scholars argue about whether he is a ruler, a god, or a ruler shown as divine, and whether the town is Kydonia itself, and nobody can prove it. Somewhere in Chania, or in a looter's pocket, lies the master seal of a Bronze Age sea-town, which makes the missing ring the best quest hook in the building.\n\nThe tablets come next. Kastelli produced roughly 97 to 99 Linear A tablets, the second largest archive of Minoan writing after Hagia Triada, mostly records of crops and livestock. They survive because the fire of about 1450 BC baked them hard, so that the destruction that ended one world preserved its account books. Nobody can read the words, though the numbers and some commodity signs can be read, so we can count the sheep but not say their names. Later, from the 13th century BC, five Linear B tablets from the same dig are written in an early form of Greek. One of them, KH Gq 5, records honey offerings, roughly to the sanctuary of Zeus, one amphora of honey to Zeus and two to Dionysos. The reading is not certain, and not every tablet may be on display. Dionysos appears at Pylos as well, so Chania is not the only Bronze Age wine god. What can be said with confidence is that two gods who later appear together on the Greek stage are already on a bookkeeping tablet, and the younger one gets the bigger share.\n\nLook also for the painted clay coffins, called larnakes, from the cemetery of Armeni, which date from about 1400 to 1200 BC and include one with a hunting scene. Armeni is near Rethymno, not Chania, so they are on loan to the story rather than part of the town. There is also the Kydonia pottery, inscribed stirrup jars that clay analysis traces to west Crete (others turned up at Thebes), and the clay bar stamped with twelve impressions from ten seals. After them comes the later Greek and Roman city, the town Strabo ranked with Knossos and Gortyn.\n\nThe day began in a bay where, in the myth, a bronze giant ran the island's perimeter three times a day to keep ships off. It has taken you over the layers of Chania, Minoan, Greek, Roman, Byzantine, Venetian, Ottoman and Greek again, with the sea as the thread through all of them. Under the hill where you stood this morning, a Minoan town counted its honey for gods whose names we can still read, and the rest of the story is who held the harbour next.\n\nTo get home, take a taxi from here to Souda. With thunderstorms forecast and the ship leaving at 18:00, give yourselves a margin and be back well before the time, since ships have always run for shelter in Souda Bay when the weather said so, and today you did too."}],"jamie":[{"n":1,"slug":"souda","title":"Where the Weather Sends You","short":"Out the window is Souda Bay, about 15 km long and one of the deepest natural harbours in the Mediterranean, sheltered from the north by the Akrotiri peninsula. Ships have been coming here when the wind says so for centuries, and in 1645, when Chania surrendered, townspeople who chose to leave were ferried across to the Venetian fort on the islet in the bay, which held out until 1715. On the shore lies the Commonwealth war cemetery, where families chose the words on the stones, while warships now sit across the water. Your shuttle sets you down by the Market Hall, about 25 minutes away.","long":"Out over the water, Souda Bay is about 15 km long, usually described as one of the largest and deepest natural harbours in the Mediterranean, and the long arm of the Akrotiri peninsula to the north keeps most of the sea out of it. This is why Scarlet Lady is here: the wind closed Mykonos to you this morning, and a ship in trouble with the weather has been coming to this bay for as long as there have been ships. Chania itself lies 7 km along the coast.\n\nThe small island near the mouth of the bay was fortified by Venice, with the main works usually dated to the 1570s, because whoever held it controlled the way in. It matters most for a day in August 1645, when the Ottomans, having taken Chania after a siege of 56 days, allowed the Venetian garrison and any townspeople who wished to leave to be evacuated, unharmed, to Souda under the surrender terms. For a household that meant a few hours to decide whether to stay in the house the family had lived in, under new masters, or to leave it. Then they had to choose what would fit in a boat, and some of those families had been in Chania since the 1250s, when the Venetians founded the town. Chania fell, but the island did not, and Souda, Gramvousa and Spinalonga stayed Venetian even after Candia surrendered in 1669, Souda holding out until 1715, 70 years after the city behind it. Under the Ottomans the same rock later sheltered Cretan insurgents, so that for ordinary people on this coast an island fortress was part of the landscape of choices, a place to be sent and a place to run to.\n\nA different set of workers uses the same depth of water today. Across the bay you will see grey warships, since Souda Bay hosts Greek naval facilities, a US naval support base and a NATO pier, with a NATO missile firing range up on Akrotiri. A bay that sheltered Venetian galleys now shelters the alliance's navies.\n\nThe quieter presence on this shore is Souda Bay War Cemetery, about 1.5 km from the port and beside the water, run by the Commonwealth War Graves Commission and holding 1,564 burials. The Battle of Crete lasted from 20 May to 1 June 1941 and was the first invasion in history carried out mainly from the air, with the decisive fighting at Maleme airfield, west of Chania. The graves here are mostly British (862), followed by New Zealand (446) and Australian (197), with a few South African, Canadian and Indian burials, and many are unidentified. Where the name is known there is often a line of personal inscription at the foot of the stone, chosen by families a very long way from here. Anyone who stops to read them is reading the household history of this bay. They were farm boys from Otago and Queensland and clerks from London, and the people at home had to decide what a stone should say in a few lines.\n\nCrete's civilians were part of that battle too. The Maritime Museum later today has a gallery on 1941 that is about villagers as much as soldiers, since the stories of Cretan families fighting the paratroopers with whatever they had are well known on the island.\n\nGreek myth gave Crete a bronze guardian, Talos, who circled the island three times a day and stoned any strange ship that came near. The poem that tells it was written by Apollonius of Rhodes, who links it to the island you toured two days ago, and these days strange ships are allowed in, to the harbour's benefit. The shuttle (or the number 13 bus) takes about 25 minutes and puts you down near the Market Hall, the big cross-shaped building with its doors shut for restoration, which is your next stop."},{"n":2,"slug":"agora","title":"One Roof, Every Trade","short":"This cross-shaped hall is Chania's Municipal Market, begun in 1911 and, reportedly, modelled on Marseille's covered market. It stands on the stump of a Venetian bastion called Piatta Forma, so the town's shopping floor replaced a defence, and Prime Minister Venizelos opened it on 4 December 1913, three days after Crete united with Greece. Its four wings hold 76 shops, traditionally butchers, fishmongers, greengrocers and cheese and herb sellers under one roof. It is closed for restoration today (reopening announced for 4 December 2026), so admire it from outside and then walk north-east about 7 minutes to Splantzia.","long":"The doors of the building in front of you are shut, which matters less than it might, because the outside tells most of the story. The Municipal Market is a cross, with four wings and an entrance facing each point of the compass and 76 shops grouped around the arms. Building began in 1911, and several tourism sources say the plan was modelled on the covered market of Marseille, a claim that is repeated more often than it is proven. It is closed for restoration, with its reopening announced for 4 December 2026, so what you see is the shell of a place that is normally loud.\n\nThe hall stands on the remains of a Venetian bastion called Piatta Forma, part of the line of walls on the eastern side of the city. Part of those walls was demolished to make room, one piece of the clearing of the old defences that went on in the early 20th century as the town outgrew them. For a household historian the exchange is a good one: the wall that kept 16th-century families in was removed so that 20th-century families could shop. Behind the walls the town had been cramped, while outside them there was space for a building with air, light and running water, which in those years counted as civic virtue. A single hall with standard stalls replaced the scattered street markets in the name of public hygiene and pride in a brand-new Greek town.\n\nThe timing explains much of the ambition. The Greek flag went up at Firkas on 1 December 1913, the formal moment of Crete's union with Greece. Three days later Eleftherios Venizelos, who was born just outside Chania and was by then Prime Minister of Greece, came home to open the market. A covered market became a statement that this was now a modern city in a Greek state. A household in 1913 had changed flags without moving house: the people who bought bread, cheese and fish here had been Ottoman subjects, then residents of an autonomous Cretan State under four Great Powers for 15 years, and were now Greek citizens.\n\nThe wings were traditionally divided by trade, with butchers, fishmongers, greengrocers, and sellers of cheese and herbs, although which wing held which trade is not recorded in anything easy to check, so the layout is best taken loosely. What matters is how a household used a place like this. Someone walked the arms of the cross with a basket, knowing which stall had good mizithra (the soft fresh cheese that goes on dakos, the barley rusk with tomato) and which seller would weigh fairly. Crete's food has always depended on that kind of knowledge. It also depends on wild greens (horta) from the hills, olive oil from the family trees, snails after rain and cheese pies called kalitsounia, so when you eat later you will find how much of it never comes from a shop at all.\n\nThis spot is also a good place to stand back and set out the layers of the town, because everything else today stacks on them. Under the hill ahead of you, Kastelli, lies Minoan Kydonia, followed by Greek and Roman Kydonia (the Romans took Crete in 69 BC) and by Byzantine rule. That rule was interrupted by the Arab Emirate of Crete from 824 to 961, until Nikephoros Phokas took the island back. In 1252 Venetian colonists founded La Canea on the old site, and Venice held it until 1645, when the Ottomans took the city after 56 days. Ottoman rule lasted until 1898, with a short Egyptian interlude from the 1830s to 1840, and was followed by the Cretan State, with Chania as its capital, from 1898 to 1913, and then by Greece. Each change altered things differently for different groups, in who paid which tax, which building was a church and which a mosque, and who could own land near the harbour and who had to leave. The rest of the morning follows those changes through ordinary lives.\n\nIf the wind is strong you will feel it funnel along the street here. Walk north-east with the sea on your left and the old town on your right for about 7 minutes to Splantzia, a square with a plane tree and, on its church, both a minaret and a bell tower. Coffee is waiting under the tree, and with it the story of what happened to a quarter of the city in 1923."},{"n":3,"slug":"splantzia","title":"A Minaret and a Bell","short":"You are in Plateia 1821, Splantzia, the old Muslim quarter, facing the church of Agios Nikolaos, built around 1320 by Dominican friars, turned into the Sultan's mosque after 1645 and Orthodox again since 1918. It wears a minaret (about 36 m) and a bell tower added in the 1950s, reportedly a combination found nowhere else in Greece. Neighbours here spoke the same Greek and prayed in different buildings until the 1923 population exchange sent the Muslim families away, and the story that the big plane tree was used for hangings is legend. Have coffee at Platanos, then walk 4 minutes west, uphill, to Kastelli.","long":"You are in Plateia 1821, in the district called Splantzia, from the Venetian word for piazza. The big plane tree stands in front of you with coffee tables beneath it, and across the square rises a church with a tall round minaret beside a bell tower, a pairing that holds most of the neighbourhood's history in a single building.\n\nThe church is Agios Nikolaos, built around 1320 by Dominican friars as a Roman Catholic monastery church, in the Venetian period, when the Dominicans of Candia ran a brotherhood here. After the Ottomans took the city in 1645 it was one of three churches converted into mosques right away, and it became the Hünkar Camii, the Sultan's Mosque, named for Sultan Ibrahim, who had launched the war. The cylindrical minaret is about 36 m tall and would have topped 40 with its lost conical cap. In 1918 the building was reconsecrated as an Orthodox church dedicated to St Nicholas, and the bell tower was added in the 1950s. It is often called the only building in Greece with both a minaret and a bell tower, although that is widely repeated rather than proven. It is a working church, usually open in the daytime outside services and free to enter, and worth a quiet look if you are dressed for it.\n\nImagine the square on an ordinary morning in, say, the 18th century. Splantzia was the heart of the Muslim quarter, Topanas to the west was the Christian quarter, and the Jewish quarter, Evraiki, lay a few streets away, though the labels flatter the neatness of it. Many of the Muslims here were Cretans whose families had converted over the generations after 1645. They spoke Greek, ate the same food, followed the same seasons and heard the same music as their Christian neighbours, so the differences lay in which building they entered on Friday or on Sunday, what taxes they paid and what the law allowed them. A tradition says that the small church of Agioi Anargyroi, just off the square, was the only place Orthodox Christians were allowed to worship in the city, but it is a tradition and not a checked fact. What the pattern suggests is how life under a conquering faith was organised day to day, through negotiation, with households finding workable arrangements with the neighbours on both sides of the wall.\n\nThe plane tree has a tale of its own that comes with a warning. Local tradition says that Ottoman authorities hanged Orthodox clergy and rebels from it, and that the bishop of Kissamos, Melchisedek Despotakis, was hanged here in 1821. The story has been repeated because it feels right, and the record does not confirm it, so it is best treated as legend. What is solid is that 1821, the year the Greek revolution began, gave the square its name, and that Crete's part in that revolution brought reprisals and rebellion over and over, through the long chain of revolts in the 19th century.\n\nThe year that deserves a quiet minute is 1923, when the Treaty of Lausanne had Greece and Turkey exchange populations by religion. Most Cretan Muslims left, many of them from families who had lived here for generations and had never lived anywhere else, speaking Greek to the last. Their houses were taken over by Orthodox refugees from Asia Minor, who were leaving their own homes and had also lost everything. Neither group had much choice, and both were households trying to start again with a few bags, so that the minaret now stands for a community that was here for centuries and then gone.\n\nPlatanos, on the square, is good for coffee or a raki under the tree, facing the church and minaret. Raki is often brought free after a meal in Crete, so the habit of hospitality has outlasted every change of flag, and if the weather is turning you can shelter under the tree's canopy for a minute or step into the church.\n\nWhen you are ready, head about 4 minutes west, uphill, to Kastelli hill, where something much older lies under all of this: a Bronze Age kitchen behind a fence."},{"n":4,"slug":"kastelli","title":"The Kitchen Under the Hill","short":"You are on Kastelli hill, over Minoan Kydonia, and through the fence at Agia Aikaterini square lies a house from about 1450 BC, destroyed by fire. In its kitchen archaeologists found a clay hearth with a loom beside it and a jar of about 3 kg of burnt lentils and vetch. The same fire baked clay tablets hard, leaving about 99 Linear A accounts and the sealings that locked jars and doors. A later Linear B tablet records honey for Zeus and Dionysos, in effect a receipt for gods, and the quince takes its name from the town. Walk down about 4 minutes to the Neoria on the east harbour.","long":"You are standing on top of a Bronze Age town. Kastelli hill, the low rise behind the harbour, has been lived on almost without a break for about 5,000 years, the one gap being roughly 1150 to 735 BC. From Agia Aikaterini square, on Kanevaro Street, you can look through the fence at a patch of excavation about 600 m² in area, with around 2 m of layers stacked up beneath a protective roof built in 2005 to 2008. Digs began in 1964, and from 1970 the Greek-Swedish excavation took over.\n\nThe house you are looking at is called Building 1. It covered 225 m², had two storeys and 14 rooms on the ground floor, and was surrounded by streets and small squares. The detail worth walking a long way for comes from a kitchen, where archaeologists found a clay hearth with a loom beside it. In a jar they found about 3 kg of burnt legumes, vetch and lentils or peas, carbonised where they sat, so that someone had evidently been cooking and weaving in the same room. Around 1450 BC a fire swept through, part of a Crete-wide wave of destruction, and the meal was never eaten.\n\nThe same fire preserved something else. Clay tablets, which would normally be dried in the sun and then crumble, were baked hard, so that about 97 to 99 Linear A tablets, found in 1973, survive from here, the second-largest archive of this script after Hagia Triada. Most are records of farm produce and livestock. Because Linear A has never been deciphered we can read the numbers and some commodity signs, and so the accounts, but not the words, which means we can count the sheep without being able to say their names. Alongside the tablets were clay sealings, lumps pressed with a seal and stuck over the string on a jar, box or door so that anyone could tell whether it had been opened. One clay bar carries twelve impressions from ten different seals, a piece of bureaucracy in clay in which someone checked who had opened the storeroom.\n\nThe most famous find is the Master Impression, a sealing from the second half of the 15th century BC. It shows a long-haired male figure in a kilt, holding a staff or spear, standing over a multi-storey walled town on a rocky shore, with windows and horns of consecration on the buildings. The gold ring that made it has never been found, and scholars argue whether the figure is a ruler or a god and whether the town is Kydonia, none of which can be proved. The walls sit awkwardly with the old idea of a peaceful Minoan Crete, itself a contested notion.\n\nAbout two centuries later, in 1989 and 1990, archaeologists found five Linear B tablets here, in the Greek of Mycenaean Crete and dated to the 13th century BC. One, called KH Gq 5, records honey, and is read roughly as: to the sanctuary of Zeus; to Zeus, honey, 1 amphora; to Dionysos, honey, 2 amphorae. It sets two later Greek gods side by side, with Dionysos getting double. It shows religion as lived practice and as household economy, with offerings budgeted on the same kind of clay as sheep and wool (that it shows Dionysos already as Zeus's son is a guess, not a finding).\n\nThe name of the town is securely written at Knossos, where scribes wrote ku-do-ni-ja in their records, while no tablet found here has yet been shown to carry it, so the safe claim is that Knossos knew this town. Inscribed jars from west Crete turned up at Thebes, traced by clay analysis. The Knossos tablets list named women as textile workers on rations, so women clearly worked and took part in ritual, although whether they ruled is unknown and the Minoan matriarchy of popular books is a modern idea, not a finding.\n\nThe town gave the world a fruit, since the Greeks called the quince the Kydonian apple and the botanical name Cydonia comes from it (a few linguists suspect an older word was bent to fit the town). Homer mentions the Kydonians, and the founder, King Kydon, is a myth with several versions, while the Minotaur belongs to Knossos.\n\nAbove all this the Byzantines built a wall in the 10th century and the Venetians made the hill their Castello, where nobles and officials lived, while Greek artisans and fishermen lived outside until the new walls of 1536 to 1568 enclosed them. From here it is about 4 minutes down to the east harbour and the long stone sheds of the Neoria."},{"n":5,"slug":"neoria","title":"Sheds for the Winter Fleet","short":"The long arched sheds along the south side are the Venetian Neoria, shipyards built from 1526 to 1599, with 17 vaults here and five more (the Moro yards) on the east side, so about 22 in all, though some sources say 23. Each hall is about 50 m long with an open sea end, so that galleys could be hauled in to be built, mended and kept dry for winter, and in 1645 the Ottomans found 12 galleys inside. In a Moro yard sits Minoa, a lashed, nail-free replica of a Bronze Age ship rowed to Piraeus in 2004. The lighthouse is about 10 minutes out along the breakwater.","long":"The row of long, arched stone sheds on the south side of the harbour is the Neoria, the Venetian shipyards, and it is one of the few places on this walk where a whole working industry still stands in front of you. The first two were finished in 1526, by 1593 there were 16, and the 17th completed the south range in 1599. A few years later five more, the Moro yards, were added on the east side of the harbour, where you are heading, which makes about 22 in all, though some sources say 23 and none can be taken as certain. A row of seven vaulted halls survives together, with one more farther west, the Grand Arsenal, which now houses the Centre of Mediterranean Architecture.\n\nThe scale is what impresses. Each hall was about 50 m long, 9 m wide and 10 m high, with arched openings in the side walls linking the halls and the seaward end left open. Galleys could be hauled straight in on slipways and then built, repaired and kept through the winter, out of the storm season and safe from corsairs.\n\nThe sources are thin on who worked here, so this is a reasonable inference and not a record. Shipbuilding on this scale meant carpenters, caulkers, rope-makers and oarsmen, and a ship under repair needed people who could cut timber, drive and seal planks, spin and tar rope, and make sails. The yards were probably the town's biggest employer, and many families would have lived near them because of that.\n\nWhen the city fell in 1645 the Ottomans walked into the arsenal and found 12 Venetian galleys sitting in the sheds, and the buildings outlived their owners. Later uses reportedly included Ottoman and Egyptian military stores and then 20th-century warehouses and workshops, though the details are thin, and a war factory is now in part an architecture centre, having kept finding new work.\n\nThe Moro shipyard at the east end holds the exhibit most worth seeing. Minoa is an experimental replica of a Minoan ship of the 16th to 15th centuries BC, about 17 m long and about 4 m wide. It was built from 2001 to 2004 of split cypress planks lashed and sewn together, not nailed, with oars and a single square sail. The design drew on ship images such as the Akrotiri flotilla fresco on Santorini and on seals, and in 2004 the ship was rowed and sailed some 210 nautical miles from Chania to Piraeus for the Athens Olympics, meeting the Olympic flame at the end. The annex is part of the Maritime Museum, with entry of about 3 euros and opening until 31 October, while the Maritime Museum itself has its own hours and a separate ticket, and you will pass it later.\n\nBeside a hull like that it is easy to think of the household around it, since someone had to cut the cypress, split the planks, make the rope that lashes them, weave the sail and feed the crew who would row. An old Greek source adds a line that is best held lightly: Thucydides says Minos was the first to build a navy and that he cleared the sea of pirates so that his revenues could come in. Whether there was ever a Minoan naval empire is argued over, and scholars today tend to prefer a picture of trade and cultural influence. The Minoan ships were real, though, jars exported from this town turned up on the mainland, and the sea is the island's long constant.\n\nIf the weather is dry enough, go out along the breakwater to the lighthouse, about 10 minutes away. Bear in mind that the stones can be wet and slippery and spray may come over, in which case you can skip it and take the view from the quay. The lighthouse looks a little like a minaret, for a reason that comes next."},{"n":6,"slug":"lighthouse","title":"The Tower at the Harbour Mouth","short":"You are at the end of the breakwater beside a tower with an octagonal base, a 16-sided middle and a round top, built to bring boats, cargo and fishing families home past these rocks. Venice built the first light here in the late 16th century, and the tower you see is a 19th-century rebuild (local accounts say about 1839, under Egypt; other sources say 1864), whose shape is why people call it minaret-like. Looking back, you see the working waterfront as it appears from the sea. If the spray is coming over, turn around here; otherwise it is about 15 minutes back along the breakwater and round the harbour to the domed mosque.","long":"You are at the end of the breakwater beside the lighthouse, whose tower has an octagonal base, a 16-sided middle section and a round top, all built of stone with a stair inside. The path out here is uneven, so if the sea is coming over the wall and the stones are wet, this is the place to turn back. If it is safe, you are about 600 metres from where the breakwater begins, standing in a spot that exists for one reason, which is to get ordinary working boats home.\n\nA harbour like this is less about the grand ships than about the caique that left before dawn and has to find the gap between the rocks in a north wind. It is about the cargo boat carrying oil or wine or cloth, the porter waiting on the quay, the customs man and the wife who watches the horizon from a kitchen window, and a light is a promise made to all of them. Venice built the first one at the end of this breakwater in the late 16th century, usually dated 1595 to 1601. After the Ottoman conquest in 1645 it fell into neglect, as often happens when the flag changes and the soldiers and tax collectors arrive well before the maintenance budget does.\n\nThe tower you see is a 19th-century rebuild, and sources disagree on when. The most common local account puts it around 1839, during the ten years (1830 to 1840) when Crete was ruled from Egypt by Mehmet Ali. It is sometimes called the Egyptian lighthouse for that reason. Other sources say 1864, and it is fair to carry both dates and not choose. Either way it went up under a regime that was neither Venetian nor yet Greek, and its octagon and stair gave it the look of a minaret, a practical building quietly outliving the people who commissioned it.\n\nThe Egyptian decade was short and odd, with some tax reforms, some public works, a rebuilt lighthouse and a good deal of unrest. For most households the question was the one it always is when rulers change: who collects the tax, and how much is left on the table. A fixed white light was installed in May 1915, making this an official lighthouse of the Greek service two years after Crete joined Greece. Today it flashes red every 2.5 seconds and is visible about 7 nautical miles out; it was damaged in the Second World War and restored in 2005 to 2006. Nothing documented names the keepers or harbour workers of any period, though a light like this needs someone to climb that stair, which is worth picturing as you stand here.\n\nThere is an older kind of care on this coast, too. West of Chania, on the tip of the Rodopou peninsula, lies the sanctuary of Diktynna, whose name comes from the Greek word for a net. Legend says she threw herself from a cliff to escape King Minos and was caught in fishermen's nets, becoming their goddess. This is a myth, and the sanctuary's oldest finds date only from the late 7th or 6th century BC, so it is not shown to be Minoan. It is nonetheless a lovely detail that fishing families prayed to a goddess of the net because the net was how they ate.\n\nTurning back, you get the best view of the whole waterfront, with the quay, the mosque dome, the old shipyards and the houses stacked behind, which is the working street of the town seen from the sea. For generations the walk out here has been a family ritual, an evening stroll along the sea wall, and you can see who is taking it today in whatever weather you have been given.\n\nWhen you are ready, head back along the breakwater and then round the harbour; it is about 15 minutes along the quay to the low domed mosque, the next stop."},{"n":7,"slug":"mosque","title":"The Neighbours' Mosque by the Sea","short":"The squat building with the big dome and a row of small domes over its porch is the Kioutsouk Hasan mosque, also called Yiali Tzamisi, the Seaside Mosque. It went up from 1645, right after the Ottoman conquest, and is usually called the oldest surviving Ottoman building on Crete, named for Küçük (Little) Hasan Pasha, the first Ottoman commander. The minaret is gone, but you can imagine a neighbourhood fixture on the quay, with prayer, coffee and trade within a few steps of each other. After 1923 it served as a warehouse, a museum and a tourist office, and it now opens only for exhibitions, so look for a sign. Walk west along the harbour, about 5 minutes, to Firkas.","long":"You are standing in front of the Kioutsouk Hasan mosque, called Yiali Tzamisi, the Seaside Mosque, by the Greeks. It has a large hemispherical dome on four great arches and a row of smaller domes over the porch (sources count six or seven, so you may want to count them yourself). A minaret once stood here and was demolished in the 20th century, in the 1920s or by 1939 depending on the source. The building opens only for temporary exhibitions, so check the door, though it is worth seeing from outside in any case.\n\nIt was built from 1645, straight after the Ottoman conquest, and is usually called the oldest surviving Ottoman building on Crete, with some sources giving 1645 and others 1645 to 1649. The name is Küçük, \"Little\", Hasan Pasha, given as the first Ottoman commander of the city, and it is also known as the Mosque of the Janissaries. Tradition names an Armenian architect, which is better taken as a story than a record.\n\nThe town came to this point by way of a war that began in 1644, when the Knights of Malta captured an Ottoman ship, reportedly carrying a member of the Sultan's harem, and put in on Crete, and Sultan Ibrahim blamed Venice. The Ottoman fleet left Istanbul on 30 April 1645 and reached Chania in late June, and the siege lasted 56 days (some sources say 54 or 57), ending on 22 August. Roughly 50,000 men and 416 ships came against about 12,000 defenders, mostly local militia rather than professional soldiers. A commander named Blasio Zulian, who held the little fort on the islet offshore with 30 men, chose to blow it up with himself and them inside rather than surrender. The Venetian garrison and townspeople who wished to leave were evacuated unharmed to Souda, and the war moved on to Candia (Heraklion), where it lasted about 21 years.\n\nWhat a conquest means on an ordinary street is easier to see from here. Straight after the surrender three churches in Chania became mosques, and Venetian families who could leave did so, while an Ottoman garrison of about 8,000 stayed, and a garrison is not just soldiers but bakers, boatmen, coffee sellers, tailors, women running households and children underfoot. A mosque built on the quay, where the Venetian galleys had once tied up, did several jobs at once: it was a place to pray five times a day, but also a landmark, a meeting point and a sign of who now ran the harbour. What survives is the building and its dates rather than any record of daily life around it, but it is reasonable to picture the quay as a working street, with fishermen, porters, coffee houses and customs men within earshot of the call to prayer.\n\nThe population that used it was more mixed than the word \"Ottoman\" suggests. Over the following generations many Cretans converted, so that Muslims in Chania were often Greek-speaking Cretans living next to Orthodox Christians and a Jewish community in a quarter of its own. Splantzia, where you stood earlier, was the Muslim quarter, and Topanas, where you are going, was the Christian one. They shared a language, a cuisine and a good deal of music while praying in different buildings, until 1923, when the population exchange following the Treaty of Lausanne sent most Cretan Muslims away and the mosques lost their congregations almost overnight.\n\nThe building's later history follows the city's changing priorities: it became a warehouse, then the Archaeological Museum, then an office of the Greek Tourism Organisation, and it now belongs to the Port Fund and is used for exhibitions. It has survived, as buildings that outlast their original purpose usually do, because it has been useful to every regime since.\n\nWith your back to the sea you can take in the dome, the harbour and the people walking past, and then continue west along the waterfront; it is about 5 minutes to Firkas, the fortress at the harbour's western mouth."},{"n":8,"slug":"firkas","title":"Barracks, Prison and a Flag","short":"Before you is Firkas, the Venetian bastion at the western mouth of the harbour, whose name comes from the Turkish firka, barracks; under the Ottomans it was a barracks and a prison, with hundreds of men eating, sleeping and waiting inside these walls. On 1 December 1913 the Greek flag went up here for Crete's union with Greece. Today it holds the Maritime Museum of Crete (09:00 to 17:00, 4 euros), with Bronze Age ship models, Venetian galleys and a Battle of Crete gallery, and the caique tools and nets on display show a fishing family's living. From here walk about 5 minutes south into Topanas and the old Jewish quarter.","long":"You are at Firkas, the fortress at the west end of the harbour, built in 1620 beside the San Salvatore bastion at the north-west corner of the walls to guard the harbour mouth. Its name gives away what came next, since firka is Turkish for barracks, and under the Ottomans this was a barracks and a prison. The museum inside, the Maritime Museum of Crete (open 09:00 to 17:00, 4 euros), was founded in 1973.\n\nAfter 1645 about 8,000 soldiers were left to hold Chania, and they had to be housed, fed and kept in order somewhere; a garrison eats grain, meat and oil every day, wears out boots, and needs water, fuel and bread. The same buildings held prisoners, and a prison, then as now, was a household of its own, in which feeding the inmates fell in many places in the period partly to their families, who came to the gate with bread. That cannot be documented for Firkas, so it is best taken as the general pattern rather than a local fact, but every flag that flew here certainly relied on ordinary people to keep it supplied.\n\nThe 19th century brought a run of Cretan revolts, in 1866 to 1869 (remembered most for Arkadi monastery, near Rethymno, where defenders blew up their powder store rather than surrender), then in 1878, 1889 and 1895 to 1897. In each, villages emptied, women and children took shelter in monasteries, and families had a man up in the mountains. The 1878 Pact of Halepa gave Crete limited home rule, a rare case of a revolt leading to paperwork that actually changed how people were governed.\n\nIn 1898 the Great Powers (Britain, France, Russia and Italy) set up the autonomous Cretan State with Chania as its capital. The town therefore had consuls and a prince: Prince George of Greece was High Commissioner, living in Halepa, the district east of the old town. Eleftherios Venizelos, born in 1864 at Mournies just outside Chania, was a local lawyer-politician who led the Theriso revolt in 1905 against Prince George's rule and in 1910 went to Athens and became Prime Minister of Greece. A rebel turned prime minister makes a good story, but for a household his career matters more as a measure of what it took to change who made the rules.\n\nThe decisive d
