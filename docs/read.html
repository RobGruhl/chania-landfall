<script>
const STOPS = {"rob":[{"n":1,"slug":"souda","title":"The Bay Talos Guarded","short":"Look out at Souda Bay, about 15 km of deep, sheltered water tucked behind the Akrotiri peninsula. Cretan myth had a guardian for coasts like this: Talos, the bronze giant who circled the island three times a day and stoned strange ships. Today the wind did his job and sent your ship here instead of Mykonos. The Venetian fortress islet at the mouth held out until 1715, seventy years after Chania fell. In May 1941 this was the shore of the Battle of Crete, and the war cemetery sits on it. Warships still anchor across the water. Chania itself is about 7 km west. The Agora is your first stop.","long":"Start with the giant. In the Argonautica, written by Apollonius of Rhodes in the 3rd century BC, the Argo comes within sight of Crete and cannot land, because Talos is on watch. He is the last of the bronze race, a gift from Zeus to Europa (in other versions, forged by Hephaestus for King Minos), and he runs the island's coast three times a day, throwing rocks at anything that approaches. He has one weakness: a single vein at the ankle, closed by thin skin. In the poem, Medea ruins him with the evil eye and phantoms, and he scrapes the ankle on a rock. The ichor runs out of him like molten lead and he goes down. All of this is myth, and a good one to carry into a harbour. Two days ago, in Rhodes, you went looking for that island's bronze giant, the one that stood. This is Crete's, and he ran.\n\nNow look at what the wind did. Souda Bay runs about 15 km long and is usually counted among the largest and deepest natural harbours in the Mediterranean, with the Akrotiri peninsula as a breakwater to the north. When the weather turns, ships come here. They always have, and the Venetians understood the value better than anyone. On the small island at the bay's mouth they built a fortress, mostly in the 1570s (the dates aren't firm), because whoever held that rock controlled the way in.\n\nThat fortress is the best siege story in the bay. When Chania surrendered on 22 August 1645, the Venetian garrison and the townspeople who chose to leave were ferried out here unharmed. Souda held. So did Gramvousa and Spinalonga. Venice kept all three even after giving up Candia in 1669, a foothold for the day it might retake the island. It never did, but Souda flew the Lion of St Mark until 1715, in the Ottoman-Venetian war of 1714 to 1718: 70 years after Chania fell and 46 after Candia. Under Ottoman rule the islet later served as a refuge for Cretan insurgents. Picture a rock that spent seventy years as a Venetian outpost inside enemy territory, then served as a rebel refuge.\n\nThe 20th century gave the bay its next layer. On 26 March 1941, Italian explosive motor boats of the Decima Flottiglia MAS slipped in at night and crippled the heavy cruiser HMS York at anchor; she was beached and later bombed by the Luftwaffe. Two months later came the Battle of Crete, 20 May to 1 June 1941, the first largely airborne invasion in history, code-named Operation Merkur. Its decisive point was Maleme airfield, west of Chania, but the bay was part of the same fight.\n\nThe Commonwealth war cemetery sits on the shore about 1.5 km north-west of the port, and the figures are sobering. It holds 1,564 burials: roughly 860 British, 446 New Zealanders, 197 Australians and a few South African, Canadian and Indian. More than half of the Second World War graves are unidentified. If the weather lets you, and your day has room for it, a quiet minute there is a fair thing to give. If not, it is enough to know it is on the shore you are passing.\n\nToday the bay is still a military harbour. Hellenic Navy facilities, a US Naval Support Activity and a NATO pier all share the water, and you may see grey hulls across the way. D&D players might call this a neutral port with too many factions. That is roughly what it has been for 500 years.\n\nFor a quest hook, hold on to this: nearly every faction in Chania's story arrives by this water or is evacuated through it. Minoan merchants, Venetian galleys, Ottoman fleets, Royal Navy cruisers, and today a cruise ship with a wind problem. As you ride the shuttle or the line 13 bus along the shore, about 25 minutes and 7 km into town, look for the islet at the mouth. The bus or shuttle will set you down near the Agora, the big cross-shaped Market Hall, which stands on the stump of a Venetian bastion. That is your first stop."},{"n":2,"slug":"agora","title":"Groceries on the Guns","short":"You are looking at the cross-shaped Market Hall, built 1911 to 1913 and today closed for restoration (reopening is announced for December 2026, so this is an outside view). It stands on the remains of a Venetian bastion, the Piatta Forma, part of the walls designed to keep the Ottomans out. Eleftherios Venizelos opened it on 4 December 1913, three days after Crete's union with Greece. Chania's whole story is stacked here: Minoan, Roman, Byzantine, Venetian, Ottoman, Egyptian, Cretan State, Greek. Walk north-east about 7 minutes to Splantzia, the old Muslim quarter, and a church that changed sides.","long":"Look at the roofline: a cross-shaped hall, four wings with an entrance facing each compass point, said to be modelled on the covered market of Marseille. It was begun in 1911 and opened on 4 December 1913 by Eleftherios Venizelos, then Prime Minister of Greece and a local boy from Mournies, just outside Chania. It is closed today for restoration, and the reopening is announced for December 2026, so stay outside and read it from the street.\n\nHere is the part that matters for a campaign: the market stands on the remains of the Piatta Forma, a Venetian bastion on the line of the city's eastern walls. To make room, part of the walls and the bastion were demolished. Imagine a stone artillery platform, built to keep the Sultan's army out, replaced by a hall for cheese and fish. That is the plot of the whole city in one block. The fighting was over. The people had won the right to shop.\n\nNow place yourself in the layers. Chania has been several towns. Under the hill north-east of here, which you reach shortly, was Minoan Kydonia. Then Greek and Roman Kydonia (Rome took Crete in 69 BC). Then Byzantine, with an interruption: from 824 to 961 Crete was an Arab emirate, until the Byzantines under Nikephoros Phokas took it back and built a fortress on that hill against a second Arab invasion. After 1204 Crete passed to Venice, and in 1252 Venetian colonists founded La Canea on the ancient site. They stayed until 1645.\n\nThe Venetian city needed walls, and the walls are why the market stands where it does. From the late 1530s to 1568, new fortifications went up, designed by Michele Sanmicheli, one of the great military engineers of his day. Think of them as a dungeon-master's perfect defence: angled bastions, ditches, firing lines. They fell anyway, in 1645, after a 56-day siege (27 June to 22 August). You meet the siege properly at the harbour mosque later.\n\nAfter that, Ottoman rule, 1645 to 1898, with one odd interruption: from 1830 to 1840, Crete was held by Mehmet Ali's Egypt, a reward for helping the Sultan against the Greek revolution, before it went back to direct Ottoman rule. Then a stretch of limbo. Revolts came in 1866 to 1869, 1878, 1889 and 1895 to 1897, and in 1898 the Great Powers helped set up the autonomous Cretan State, with Chania as its capital. The last move came on 1 December 1913, when the Greek flag went up at the Firkas fortress and Crete joined Greece. Three days later, Venizelos was here, cutting the ribbon. A market in this style, in this place, was a statement: Chania was now a modern Greek city, with proper stalls and civic pride. Chania stayed capital of Crete until 1971, when it moved to Heraklion.\n\nSo the faction list for the day runs like this. Minoans, Greeks, Romans, Arabs, Byzantines, Venetians, Ottomans, Egyptians, the Cretan State, Greece. Each one left a layer, and you will see most of them in the next hour or two. Try a game: each time you see a wall, a dome or a vault today, name the faction that built it and the faction that took it over.\n\nTraditionally the wings were divided by trade, with butchers, fishmongers, greengrocers, and cheese and herb sellers, and 76 shops grouped around the arms.\n\nWeather note: if the showers start, this is a good moment to peer through the gates and move on. Today is a day for the outdoor stops first.\n\nNext, walk north-east about 7 minutes, through the grid of streets, to Splantzia. You are heading for the old Ottoman Muslim quarter, a plane tree with a dark legend, and a church with a minaret and a bell tower on the same building. Look for the minaret over the rooftops, and aim for it."},{"n":3,"slug":"splantzia","title":"A Church That Changed Sides","short":"You are in Plateia 1821, Splantzia, once the heart of Chania's Muslim quarter. The church of Agios Nikolaos on the square was built around 1320 as a Dominican church, became the sultan's mosque (Hunkar Camii) after 1645, and was reconsecrated Orthodox in 1918. It still carries a minaret and a bell tower, like two banners. The big plane tree is tied to a hanging story, local legend that is unverified. Coffee or raki at Platanos is the classic move: sit, and count the faction banners in view. Then walk about 4 minutes west, uphill, to Kastelli.","long":"Stand in the square and find the two towers. On the church of Agios Nikolaos you will see a tall cylindrical minaret, about 36 m, and a bell tower, which was added in the 1950s. Reportedly it is the only building in Greece with both. It reads like a faction map in stone.\n\nRound one: about 1320, the Dominicans of Candia built it as a Catholic monastery church. Chania was a Venetian colony and the friars were part of its order. Round two: after the fall of the city in 1645 the Ottomans turned it into a mosque, one of three churches converted straight after the conquest. They named it the Hunkar Camii, the Sovereign's Mosque, in honour of Sultan Ibrahim, the sultan who launched the Cretan war. The minaret comes from that period, and it would have stood taller, over 40 m, with its lost conical cap. Round three: in 1918 it was reconsecrated as an Orthodox church and dedicated to St Nicholas. Three owners, one building, and the evidence all still there.\n\nThe square itself is called Splantzia, from the Venetian word for piazza. Under the Ottomans this was the heart of the Muslim quarter of Chania, with Topanas, to the west, as the Christian quarter. It is worth saying plainly that many of Chania's Muslims were Cretan converts who spoke Greek, so the line between the quarters was religion and administration rather than language. The population also included Orthodox Christians, a Jewish quarter, and later Egyptian and Western merchants and consuls. It was a city of several communities with a garrison on top.\n\nNow the tree. A large plane tree stands in the square, and local tradition ties it to the hanging of Orthodox clergy and rebels under the Ottomans. The name most often given is Melchisedek Despotakis, bishop of Kissamos, said to have been hanged here in 1821, the first year of the Greek revolution. Treat this as legend. It is widely repeated and fits the year, but the sources I have only call it local tradition, so it stays unverified. Use it as a hook, not a fact: a place where the authorities made examples. If you want a quest, it is a good one: find out what the records actually say about it.\n\nThere is another tradition that the little church of Agioi Anargyroi nearby was the only church where Orthodox worship was allowed in Ottoman Chania. That is also unverified, and it sounds too neat, so keep it in the legend column.\n\nWhat is firmly documented is the ending. After 1923 and the Treaty of Lausanne, most Cretan Muslims left in the population exchange, exchanged to Anatolia. Their houses here were then taken by Orthodox refugees from Asia Minor. The quarter that had been the Muslim heart of the city changed its population almost overnight. When a historian says the exchange emptied Splantzia, this is what they mean: families who had lived here for generations were exchanged for others who did not know it at all.\n\nToday the square is the best place in Chania to sit down. The tavernas under the plane tree, with Platanos as the classic, will serve you coffee or a raki, and if it rains the awnings are well used to it. From a table you can see the Catholic, Ottoman and Orthodox layers without moving your head.\n\nNext, about 4 minutes west, uphill, is Kastelli, the low hill behind the harbour. The streets go narrow and the surface changes. There you will look through fences at something very much older than any of this: the town the Minoans burned, and the clay tablets the fire baked."},{"n":4,"slug":"kastelli","title":"The Town Under the Hill","short":"Kastelli is the low hill above the harbour, and under its streets lies Minoan Kydonia. Look through the fences on Kanevaro Street and at Agia Aikaterini square. A fire around 1450 BC destroyed the town and baked its clay archive hard. Here were found the Master Impression, a sealing of a giant figure over a walled sea-town, and a Linear B tablet recording honey for Zeus and Dionysos. Byzantine and Venetian walls sit on top. Then walk down about 4 minutes to the Neoria, the Venetian shipyards on the east harbour.","long":"Look through the fence at Agia Aikaterini square and Kanevaro Street. What you see is a section cut through a town: stone walls at several levels, floor plans, and a protective roof built in 2005 to 2008. This is Minoan Kydonia. People lived on Kastelli hill almost continuously for about 5,000 years, with one gap of roughly 1150 to 735 BC. The digs began as rescue work under Yannis Tzedakis in 1964, became the Greek-Swedish excavation in 1970, and showed that western Crete had a major Minoan centre.\n\nThe story begins with a fire. Around 1450 BC (sources give anywhere from 1480 to 1425) a destruction swept Kydonia, part of a wave across Crete that ended the world of the great Neopalatial towns. Fire is a good excavator. In one kitchen archaeologists found a clay hearth with a loom beside it, and a jar holding about 3 kg of lentils and vetch, charred. The fire also baked the clay tablets in the archive, so that they survived. Kydonia produced roughly 97 to 99 Linear A tablets, the second-largest archive of that undeciphered script after Hagia Triada, found in 1973. Most record crops and livestock; the language remains unread.\n\nThen there is the Master Impression. It is a clay sealing, a few centimetres across, from the second half of the 15th century BC. It was stamped by a gold signet ring that has never been found. The picture shows a towering long-haired male figure in a kilt, holding a staff or spear, standing over a multi-storey complex with windows, horns of consecration and gates, on a rocky shore by the sea. Who is he? A king, a god, or a ruler shown as divine, scholars disagree. Some read the town as Kydonia itself, which is possible but unprovable. Notice that the town is walled, which is awkward for the old idea of a peaceful, unfortified Minoan Crete. That \"Minoan peace\" is contested, and so is the claim that the Minoans were ruled by women, so be sceptical of both. As a D&D image, though, it is hard to beat: a giant looming over a harbour town, and no one has the ring.\n\nAfter the fire, the story keeps going. Knossos came under Greek-speaking rulers writing Linear B around 1450, and the same script turns up here. Five Linear B tablets were found at Agia Aikaterini in 1989 and 1990, dated to the 13th century BC. Chania is one of very few places on Crete with Linear B tablets, along with Knossos and Malia. One of them, KH Gq 5, records honey. It reads roughly di-we for Zeus, one amphora, and di-wo-nu-so for Dionysos, two amphorae. Both gods are named, and Dionysos gets more honey. That is about 800 years before classical Greek drama. Whether it proves anything about their relationship is speculation, and Dionysos also turns up at Pylos. The name Kydonia, written ku-do-ni-ja, is certainly attested on tablets from Knossos. Nothing says a tablet found here names the town.\n\nThen the town lives on in memory. Homer's Odyssey names the Kydonians twice, and has Menelaus's ships wrecked on Crete near their coast on the way home from Troy. Strabo ranks Knossos, Gortyn and Kydonia as the three most notable cities on the island. The Greeks called the quince the Kydonian apple, and that gave English the word quince, though some linguists suspect a pre-Greek word got attached to the town. The myths give the town a founder, King Kydon, whose parentage depends on the storyteller: a son of Hermes or Apollo and a daughter of Minos, or of an Arcadian, or Minos himself did the founding. The Minotaur and the Labyrinth are at Knossos, not here.\n\nOn top of all this are the later factions. A Byzantine fortress went up here in the 10th century to hold off a second Arab invasion, and parts of its wall survive. Venice's Castello followed, a walled upper town with the Rector's palace and the Latin cathedral. Ordinary townsfolk lived outside it until the new walls of 1536 to 1568 enclosed them. Bombing in May 1941 left the open lots that made digging possible. Every faction left a layer.\n\nThe fence is the view; the objects are in the museum, your afternoon stop.\n\nNext, walk down about 4 minutes to the east harbour. You are heading for the Neoria, the Venetian shipyards, long stone sheds where galleys were hauled in, and one of them now holds a Bronze Age ship."},{"n":5,"slug":"neoria","title":"Dragon Lairs for Galleys","short":"Look at the row of long, arched stone sheds on the harbour edge. These are the Venetian Neoria, shipyards where galleys were hauled in to be built and wintered. Seventeen stand on the south side, with the Moro yards to the east; sources say 22 or 23 in all. When the Ottomans took the city in 1645 they found galleys inside. One Moro shed holds the Minoa, a lashed Bronze Age ship replica rowed to Piraeus in 2004. Then follow the breakwater about 10 minutes to the lighthouse, weather and spray permitting.","long":"Look at the arches. Each is the open seaward end of a long vaulted hall, about 50 m long, 9 m wide and 10 m high, with arched openings in the side walls linking one hall to the next. A galley could be hauled in stern first, out of the weather and out of sight. Call them dragon lairs, and you will not be far wrong.\n\nThe Neoria were the working heart of Venetian Chania. The first two were finished in 1526. By 1593 there were 16, and the 17th completed the south range in 1599. A few years later five more, the Moro shipyards, went up on the east side. That gives about 22 in all, though some sources say 23, so do not take either number as settled. They were used to build, repair and over-winter the galleys of Venice's Cretan squadron. Think of the storm season: fleets of oared warships, dragged up and sheltered, with carpenters, caulkers and rope-makers working in the dark. A row of 7 survives together, and one more stands further west, the Grand Arsenal, now the Centre of Mediterranean Architecture. It is free to look at, and open on weekdays until about 15:00 when an exhibition is on.\n\nNow run the scene the other way. On 22 August 1645, after 56 days of siege, the city surrendered. When the Ottomans walked into the arsenal, they captured 12 galleys. Twelve ships, sitting in their sheds, in a city that had just fallen: that is a very good plot hook. Souda, across the bay, was still Venetian, and ships were the one thing that could still link the two. Why were they still in the sheds? That is a question your own campaign can answer.\n\nAfter that the sheds kept finding work. Ottoman and Egyptian military stores, and 20th-century warehouses and workshops, come later. The upper storey of the Grand Arsenal is a 19th-century addition. The building kept going long after the fleet it served had gone.\n\nAnd now the better surprise. One of the Moro sheds, at the east end of the harbour, houses the Minoa, a branch of the Maritime Museum of Crete. The annex is open until 31 October and costs about 3 euro. The Minoa is a replica of a 16th to 15th century BC Minoan ship, about 17 m long and about 4 m wide. It was built from 2001 to 2004 with split cypress planks lashed and sewn together, not nailed, with oars and a single square sail. The design drew on ship images such as the Akrotiri flotilla fresco and Minoan seals. It was launched in December 2003, and in 2004 it was rowed and sailed about 210 nautical miles from Chania to Piraeus for the Athens Olympics. It met the Olympic flame, which was carried on the last leg by the trireme Olympias.\n\nPut the two ships side by side, and you have the sea's long arc. At the Master Impression's hill, just up the street, a Minoan town stood on a rocky shore, with ships we know only through paintings and seals. Here is a modern crew's best guess at one. Then, 3,000 years later, Venice's galleys filled the sheds that you are standing in front of. Minoan sailors, Venetian oarsmen, Ottoman crews, Royal Navy ships in Souda: the island's one long constant is the sea, and the factions have mostly been trying to control who sails on it.\n\nThere is also a gentle correction to the legend with which you began. Talos was said to protect Crete by stoning approaching ships. The Minoa did the opposite and sailed out, with a crew who rowed to Athens. You can read that as an answer to the giant, a modern one.\n\nIf the weather is rough, spend your time inside the Moro shed, which is dry, and give the breakwater a miss. If it is calm enough, the next stop is a walk out along the breakwater, about 10 minutes, to the lighthouse at the harbour mouth. The wall is a defence the city has used for centuries and the tower at the end is what Chania looks like to ships coming in. Skip it if the stone is wet and spray is coming over."},{"n":6,"slug":"lighthouse","title":"The Minaret for Ships","short":"You are at the end of the breakwater, or as near as the weather lets you get. The tower in front of you is the Egyptian lighthouse: an octagonal base, a 16-sided middle and a round top, which is why people have always said it looks like a minaret. Venice put a light here in the late 16th century; the Ottomans let it decay; the present tower is a 19th-century rebuild (c. 1839 under Egyptian rule by local accounts, 1864 by others). Turn round and the whole waterfront lies in front of you like a map in a campaign book. If spray is coming over the stones, look from the shore instead. Next: back along the breakwater and round the harbour, about 15 minutes, to the domed mosque.","long":"Stand where the breakwater runs out and turn your back to the sea. If the stones are wet and spray is coming over, do this from the shore end instead; the view is nearly as good and nothing here is worth a fall. The tower beside you is the Chania lighthouse, and you are standing on the harbour's sea-wall, the line that has kept the weather off the Venetian galleys for four hundred years.\n\nVenice built the first light here in the late 16th century, usually dated 1595 to 1601, as the harbour and the shipyards behind you were taking their final shape. After the Ottomans took the city in 1645 it fell into neglect. The tower you see is a rebuild, and here the sources disagree. Local and tourism accounts credit the Egyptians, who held Crete from 1830 to 1840 under Mehmet Ali, and date it to about 1839, which is why it is called the Egyptian lighthouse. Other sources say it was rebuilt in 1864. Both agree it is a 19th-century tower, and neither date is safe enough to carve in stone. The height is disputed too: about 21 metres in some sources, 26 in others.\n\nWhat is not disputed is the shape. An octagonal base, a 16-sided middle section and a round top, with a stone stair inside, gave people the same thought at once: it looks like a minaret. A prayer tower pointed at the sea, standing guard over a Christian harbour that had been Ottoman for nearly two centuries. Whoever built it, the outline is a small piece of the city's whole story in one profile. It was made an official Greek lighthouse in 1915, damaged in the Second World War, listed as a monument in 1962 and refurbished in 2005 and 2006. Today it flashes red every two and a half seconds.\n\nNow look back. From here the whole table is laid out: the domed mosque on the quay, the long vaults of the Neoria, Firkas at the far end of the harbour, the Venetian walls, and behind them the hill of Kastelli where you stood this morning. Every faction that wanted this island needed this one thing, a harbour, and you are looking at the reason all of them came. Weather like today's is exactly what the sea-wall was built for. Bronze Age sailors, Venetian galley crews and cruise ships diverted from Mykonos have all run for shelter on this coast when the north wind came up.\n\nFor a quest hook, look west across the gulf. On a clear day you can pick out the long arm of the Rodopou peninsula, and at its tip lay the sanctuary of Diktynna, the goddess of nets. The myth runs like this. Britomartis, a nymph of the hunt, was pursued by King Minos for nine months. Cornered on a cliff, she jumped into the sea and was caught in fishermen's nets, and the grateful islanders made her a goddess; Strabo derives the name Diktynna from diktyon, a net. Her temple at Rodopou was rebuilt under Hadrian, but the oldest finds there date only to the late 7th or 6th century BC, so it is not a proven Minoan site. Whether she had Minoan roots is plausible and unproven. Still, a goddess who answers a drowning person with a fisherman's net is the right patron for this wall. Put her in your campaign as the one who watches the gulf, and make her the party's patron if you are heading out to sea.\n\nYou have walked the whole length of the harbour to stand here, and you have the best view of the thing you came for. Leave the tip to the wind. Walk back along the breakwater, keep the water on your right as you go round the harbour front, and in about 15 minutes you reach the low grey domes of the mosque on the quay."},{"n":7,"slug":"mosque","title":"The Pirate Raid and the Pasha","short":"You are facing the domed mosque on the quay: Kioutsouk Hasan, also called Yiali Tzamisi, the Seaside Mosque. Built from 1645, right after the Ottoman conquest, it is usually called the oldest surviving Ottoman building on Crete. It carries the name of Küçük (\"Little\") Hasan Pasha, given as the first Ottoman commander of the city. The minaret was lost in the 20th century, and today it opens only for exhibitions, so you may see it from outside. The war that put it here began with a pirate raid by the Knights of Malta in 1644. The siege lasted about two months, and the larger war ran 24 years. Next: west along the harbour, about 5 minutes, to Firkas.","long":"The building in front of you is a squat grey mass of domes at the water's edge: a large central dome on four great arches, with a row of smaller domes over the porch. Sources count six or seven of those, so do not take anyone's number on trust. This is the Kioutsouk Hasan mosque, called Yiali Tzamisi, the Seaside Mosque, or the Mosque of the Janissaries. It was built from 1645, in the first years after the Ottoman conquest (some sources say 1645 to 1649), and it is usually called the oldest surviving Ottoman building on Crete. Tradition says an Armenian architect designed it, but that is only tradition. The minaret was demolished in the 20th century, in the 1920s or by 1939 depending on the source, and today the mosque opens mostly for exhibitions, so you will probably be looking at it from the quay. Look for a sign on the door.\n\nThink of it as a victory banner made of stone. The Ottomans put their first new mosque on the quay where Venetian galleys had tied up, in full view of everyone coming into the harbour. To see why, go back to 1644. The Knights of Malta, the same order you met on Rhodes after they lost it, captured an Ottoman ship carrying, among others, a member of the Sultan's harem, and then put in at Crete. Sultan Ibrahim blamed Venice. A raid by an order of sea-going crusaders, a captured ship and an enraged sultan: it reads like an adventure hook, and it started a war.\n\nThe Ottoman fleet left Istanbul on 30 April 1645 under Silahdar Yusuf Pasha. It reached Chania on 23 June and the siege proper began on 27 June. The sources give about 50,000 men, among them 7,000 Janissaries, 14,000 sipahis cavalrymen and 3,000 sappers, carried on some 416 ships, a few of them hired Dutch and English vessels. Against that stood roughly 12,000 Venetian defenders, described as an inadequately recruited militia, behind the bastioned walls Sanmicheli had designed a century earlier. Chania held 56 days. The city surrendered on 22 August 1645. Some sources say 54 or 57 days, depending on how they count.\n\nThe best story of the siege is the one that happened offshore. The islet fort of Agioi Theodoroi was held by Blasio Zulian with about 30 men. When the end came he would not hand the place over. According to the account, he set mines in the fort and blew up himself, his men and the fortress. Call it Crete's Alamo if you like, but a better comparison would be a doomed rearguard who made sure the other side got nothing.\n\nThe Venetian garrison and the townspeople who chose to leave were evacuated unharmed to the island fortress of Souda, the one you passed on the way in. The Ottomans walked into the Venetian arsenal and found 12 galleys still sitting in their sheds. Three churches became mosques at once. Istanbul fired its cannon for three days in celebration. A Christian relief force of Tuscan, Spanish, Papal and Maltese ships arrived too late and failed in a counterattack on 1 October. Yusuf Pasha left a garrison of 8,000 behind, and by most accounts was executed in Istanbul in early 1646 after quarrelling with the Grand Vizier.\n\nChania was only the opening. The Cretan War ran from 1645 to 1669, and its great set piece was the siege of Candia, modern Heraklion, which lasted about 21 years and is often called one of the longest sieges in history. Francesco Morosini surrendered it in September 1669. Venice kept only three island fortresses, Souda, Gramvousa and Spinalonga. Souda held out until 1715. So Chania took 56 days and Candia 21 years: the difference between a militia behind a wall and a whole continent's mercenaries paying for every metre.\n\nAfterwards the building had a long second life. Following the 1923 population exchange it served as a warehouse, then as the town's archaeological museum, then as a tourism office. It now belongs to the Port Fund. Walk west along the harbour front, past the cafes, with the fortress ahead of you. In about 5 minutes you reach Firkas."},{"n":8,"slug":"firkas","title":"The Flag Over the Barracks","short":"You are at Firkas, the Venetian bastion at the west mouth of the harbour, built around 1620. Its name comes from the Turkish firka, barracks, and under the Ottomans it was exactly that, and a prison too. On 1 December 1913 the Greek flag went up here to mark Crete's union with Greece, after a rebellion that began in 1866. Today the Maritime Museum of Crete is at its entrance (09:00 to 17:00, 4 euros): Bronze Age ship models, Venetian galleys and the Battle of Crete. If the sky opens, this is the place to go in. Next: about 5 minutes south into Topanas and the old Jewish quarter.","long":"You are standing at the harbour's western gate. Firkas was built around 1620 to guard the harbour mouth, next to the San Salvatore bastion at the north-west corner of the walls. Its name is Turkish, firka, meaning barracks, because that is what it became after 1645: a garrison post and a prison, the place where the guns pointed at the harbour belonged to the Sultan's soldiers. This fortress is the end credits of the day.\n\nThe date to know is 1 December 1913. The legal basis was the Treaty of London of 30 May 1913, under which the Ottoman Empire gave up its rights to Crete. On that December morning the Greek flag was raised over Firkas, the formal ceremony of union. The sources say King Constantine and Eleftherios Venizelos attended, and the date and the place are well established. Three days later Venizelos opened the new Municipal Market, which you saw this morning, built on the stump of a Venetian bastion.\n\nBehind that flag lie 47 years of trouble. The Great Cretan Revolt of 1866 to 1869 is remembered above all for Arkadi Monastery near Rethymno, where in November 1866 the defenders blew up their own powder store rather than surrender: the same choice Blasio Zulian had made at the islet fort in 1645, two centuries later. More risings followed in 1878, which produced the Halepa Pact and limited home rule, in 1889 and in 1895 to 1897. Each time the island's villages emptied into the hills and the monasteries, and almost every family had someone in the mountains.\n\nIn February 1897 insurgents raised the Greek flag on Profitis Ilias, the hill on the Akrotiri peninsula that you can see across the bay, and foreign warships shelled them. The famous story says the flagpole was shot away and a fighter named Spyros Kayales held the flag up himself, until the admirals stopped firing out of respect. Treat that as legend: it is widely told and it is a very good story, but the shelling is better documented than the man with the flag. The Great Powers, Britain, France, Russia and Italy, occupied the island and in 1898 set up the autonomous Cretan State with Chania as its capital. Four navies and one small state: Chania was an international town full of consuls and gunboats, and Prince George of Greece landed as High Commissioner in December 1898.\n\nThen came Venizelos. Born in 1864 at Mournies, just outside Chania, he led the Theriso revolt against Prince George's rule in 1905, and George resigned in 1906. By 1910 Venizelos was in Athens, and he went on to serve as Prime Minister of Greece for a long run of terms. A rifle-carrying rebel in the hills in 1905 and the head of the Greek government five years later: a real-life rogue-to-king career. He died in Paris in 1936 and is buried on Akrotiri, on the hill of Profitis Ilias, looking down on the city. Chania stayed the capital of Crete until 1971, when the title passed to Heraklion.\n\nNow go inside, or at least to the entrance, because the Maritime Museum of Crete is here. It was founded in 1973 and is open 09:00 to 17:00, 4 euros. It has three permanent exhibitions: the marine environment, the Battle of Crete in 1941, and ancient and traditional shipbuilding. Expect Bronze Age ship models, Venetian galleys and the 1941 gallery. If the weather turns, you will be glad of a roof. This is also the end of the museum's long run along the harbour: the Minoa, the ship you looked at this morning, now sits in one of the Moro shipyards at the far end, so you have seen both ends of the collection.\n\nWalk about 5 minutes south from Firkas, away from the water and into Topanas. The Venetians knew it as the nobles' quarter and later it was the Christian quarter. Just beyond it, in the streets around Kondylaki, was the Jewish quarter, Evraiki. The next stop is a quiet one."},{"n":9,"slug":"synagogue","title":"Etz Hayyim","short":"You are in the lane outside Etz Hayyim synagogue, on Parodos Kondylaki, in what was Evraiki, the Jewish quarter of Chania. It is open today until 15:00 and costs 4 euros, with a short tour from the staff. It was built as a church in the Venetian period and became a synagogue in the 17th century. On 29 May 1944 the Germans arrested the Jews of Chania, and on 9 June the ship carrying them, the Tanais, was sunk by a British submarine that did not know who was aboard. The synagogue was restored and reopened in 1999. Please photograph only the building. Lunch is two minutes away, and then a taxi east.","long":"The lane you are standing in is Parodos Kondylaki, in the part of Chania that was known as Evraiki, the Jewish quarter. The building in front of you is Etz Hayyim. It is open today until 15:00, the entrance is 4 euros and includes a short tour by the staff, and photographs are of the building only. It is a quiet place and it deserves to be treated as one.\n\nThe building was a church in the Venetian period and became a synagogue in the 17th century, after the Ottoman conquest. Jews had lived on Crete for a very long time, and the community that worshipped here was Romaniote, with roots on the island going back to antiquity. For centuries they were neighbours of Christians and Muslims in the streets around the synagogue.\n\nIn 1944 that ended. On 29 May the Germans rounded up the Jews of Chania, about 250 to 275 people. Another account gives 276 arrested on 20 May, so the date and the figure are not settled. They were taken by truck to Heraklion and put aboard the steamer Tanais, along with Greek hostages and resistance prisoners and Italian prisoners of war. The Tanais had been sunk once already, by the Luftwaffe in Souda Bay on 26 May 1941, and then raised and repaired.\n\nOn 9 June 1944, about 14 nautical miles north-west of the islet of Dia, the British submarine HMS Vivid fired four torpedoes from 2,400 yards. Two hit. The ship sank in about 12 seconds. The crew of the Vivid did not know who was aboard. Estimates of the dead run from 425 to 1,000, which is a wide range, and sources do not agree on it. About 265 of them were Cretan Jews; the rest were up to 400 Greek prisoners and between 100 and 300 Italian prisoners. The sinking ended the Jewish community of Crete. Chania remembers the victims every June, and there is a memorial in the city.\n\nThe synagogue itself did not disappear. It was left a ruin, and in the late 1990s it was restored under the leadership of Nikos Stavroulakis, and reopened in 1999. In January 2010 it was attacked twice by arsonists, on 5 and 16 January, and the second fire destroyed about 2,500 rare books and manuscripts. The congregation repaired it again. Today it is run by a mostly non-Jewish congregation that follows Sephardic customs and has written its own Haggadah. Queen Sofia of Spain and the former King Constantine II visited unannounced in March 2006. The building has been kept alive by people who are not descended from the families whose names are remembered on its wall.\n\nWhen you go in, you will find a courtyard and a garden, and a plaque with the names of the deported. Take the staff tour if one is starting; it is short, and the people who give it know the building better than anything written here. There is nothing to add to what the names say.\n\nWhen you come out, take your time. The next thing is lunch, and Tamam, on Zambeliou Street and housed in an old hammam, is about two minutes away; it is indoors and serves Cretan and Ottoman cooking, which suits a day of showers. After lunch, take a taxi east to the Archaeological Museum at Chalepa. It is about 25 minutes on foot, which is too much in this weather, so get a cab."},{"n":10,"slug":"museum","title":"Tablets, Honey and a Ring","short":"You are at the Archaeological Museum of Chania at Skra 15 in Chalepa (08:00 to 20:00, 15 euros with audio guide), the end of the day. Look for the Linear A and Linear B tablets from Kastelli and the Master Impression, a clay lump a few centimetres across that shows a giant over a walled sea-town. The ring that made it has never been found. Chalepa itself was the consuls' quarter of the Cretan State. When you are done, the easiest way back to the ship before 18:00 is a taxi to Souda: allow plenty of time, because the weather is bad and the roads will be busy.","long":"This is the last stop. The museum opened here, at Skra 15 in Chalepa, on 16 April 2022; the old museum in the Venetian church of San Francesco on Chalidon Street no longer holds the collection, so do not send anyone there. The new building is by Theophanis Bobotis and partners: about 6,000 square metres, triangular, emerging from the hillside and pointing towards the sea, with more than 4,100 objects on show. It is open from 08:00 to 20:00 until the end of October, closed on Tuesdays, and the ticket is 15 euros with an audio guide. The last entry is 20 minutes before closing. Check the floor plan at the desk for which room holds what.\n\nChalepa matters too. This was the elegant district of the Cretan State, the quarter of the consuls and of Prince George, and Venizelos's house is here.\n\nNow go and find the small things. Start with the Master Impression, if it is on show. It is a clay sealing from Kastelli, dated to the second half of the 15th century BC, and it is tiny, a lump of clay a few centimetres across. It was stamped by a gold signet ring that has never been found. It shows a tall figure with long hair, a kilt and a staff or spear, standing over a multi-storey complex of windowed buildings with horns of consecration, on a rocky shore, behind walls with gates. Scholars argue about whether he is a ruler, a god, or a ruler shown as divine, and whether the town is Kydonia itself. Nobody can prove it. The ring that made it is the quest hook: somewhere in Chania, or in a looter's pocket, is the master seal of a Bronze Age sea-town, and it is still missing.\n\nThen the tablets. Kastelli produced roughly 97 to 99 Linear A tablets, the second largest archive of Minoan writing after Hagia Triada, mostly records of crops and livestock. They survive because the fire of about 1450 BC baked them hard, so the destruction that ended one world preserved its account books. Nobody can read the words. The numbers and some commodity signs can be read, so we can count the sheep but not say their names. Later, from the 13th century BC, there are five Linear B tablets from the same dig, written in an early form of Greek. One of them, KH Gq 5, records honey offerings: roughly to the sanctuary of Zeus, one amphora of honey to Zeus and two to Dionysos. The reading is not certain, and not every tablet may be on display. Dionysos appears at Pylos as well, so Chania is not the only Bronze Age wine god. What you can say with confidence is that two gods who later appear together on the Greek stage are already on a bookkeeping tablet, and the younger one gets the bigger share.\n\nLook also for the painted clay coffins, called larnakes, from the cemetery of Armeni, which date from about 1400 to 1200 BC and include one with a hunting scene. Armeni is near Rethymno, not Chania, so they are on loan to the story, not part of the town. Look too for the Kydonia pottery, inscribed stirrup jars that clay analysis traces to west Crete (others turned up at Thebes), and the clay bar stamped with twelve impressions from ten seals. Then come the later Greek and Roman city, the town Strabo ranked with Knossos and Gortyn.\n\nThe day has one shape. You started in a bay where, in the myth, a bronze giant ran the island's perimeter three times a day to keep ships off. You walked over the layers of Chania, Minoan, Greek, Roman, Byzantine, Venetian, Ottoman and Greek again, and the sea is the thread through all of them. Under the hill where you stood this morning, a Minoan town counted its honey for gods whose names we can still read. The rest of the story is who held the harbour next.\n\nThe way home: take a taxi from here to Souda. With thunderstorms forecast and the ship leaving at 18:00, give yourselves a margin and be back well before the time. Ships have always run for shelter in Souda Bay when the weather said so. Today you did too."}],"jamie":[{"n":1,"slug":"souda","title":"Where the Weather Sends You","short":"Out the window is Souda Bay, about 15 km long and one of the deepest natural harbours in the Mediterranean, with the Akrotiri peninsula sheltering it from the north. Today's detour from Mykonos is nothing new: ships have come here when the wind said so for centuries. In 1645, when Chania surrendered, townspeople who chose to leave were ferried across to the Venetian fort on the islet in the bay, which held out until 1715. On the shore lies the Commonwealth war cemetery, where families chose the words on the stones. Today warships sit across the water. Your shuttle sets down by the Market Hall, about 25 minutes away.","long":"Look out at the water first. Souda Bay is about 15 km long, usually described as one of the largest and deepest natural harbours in the Mediterranean, and the long arm of the Akrotiri peninsula to the north keeps most of the sea out of it. That is why Scarlet Lady is here. The wind closed Mykonos to you this morning, and a ship in trouble with the weather has been coming to this bay for as long as there have been ships. Chania itself is 7 km along the coast.\n\nFind the small island near the mouth of the bay. Venice fortified it, with the main works usually dated to the 1570s, because whoever held it controlled the way in. Now think about a day in August 1645. The Ottomans had taken Chania after a siege of 56 days, and under the surrender terms the Venetian garrison and any townspeople who wished to leave were evacuated, unharmed, to Souda. Picture what that means for a household: a few hours to decide whether you stay in the house your family has lived in, under new masters, or leave it, and then the choosing of what fits in a boat. Some of those families had been in Chania since the 1250s, when the Venetians founded the town. Chania fell; the island did not. Souda, Gramvousa and Spinalonga stayed Venetian even after Candia surrendered in 1669, and Souda held until 1715, 70 years after the city behind it. Later, under the Ottomans, the same rock gave shelter to Cretan insurgents. For the ordinary people of the coast, an island fortress was part of the landscape of choices: a place to be sent, a place to run to.\n\nToday a different set of workers uses the same depth of water. Look across the bay and you will see grey warships: Souda Bay hosts Greek naval facilities, a US naval support base and a NATO pier, with a NATO missile firing range up on Akrotiri. A bay that was a refuge for Venetian galleys is a refuge for the alliance's navies now.\n\nThe other thing on this shore is quieter. About 1.5 km from the port, by the water, is Souda Bay War Cemetery, run by the Commonwealth War Graves Commission, with 1,564 burials. The Battle of Crete lasted from 20 May to 1 June 1941, and it was the first invasion in history carried out mainly from the air; the decisive point was Maleme airfield, west of Chania. The graves here are mostly British (862), then New Zealand (446) and Australian (197), with a few South African, Canadian and Indian burials. Many of the graves are unidentified. Where the name is known, there is often a line of personal inscription at the foot of the stone, and those words were chosen by families a very long way from here. If you are drawn to read them, that is the household history of this bay: farm boys from Otago and Queensland and clerks from London, and the people at home who had to decide what a stone should say in a few lines.\n\nCrete's civilians were part of that battle too. The Maritime Museum later today has a gallery on 1941 that is about villagers as much as soldiers, and the tales of Cretan families fighting the paratroopers with whatever they had are well known on the island.\n\nOne more small thing before you land. Greek myth gave Crete a bronze guardian, Talos, who circled the island three times a day and stoned any strange ship that came near. The poem that tells it was written by Apollonius of Rhodes, so he links to the island you toured two days ago. Today the strange ships are allowed in, and the harbour is better for it. The shuttle (or the number 13 bus) takes about 25 minutes and will put you down near the Market Hall, the big cross-shaped building with its doors shut for restoration. That is your next stop."},{"n":2,"slug":"agora","title":"One Roof, Every Trade","short":"This cross-shaped hall is Chania's Municipal Market, begun in 1911 and, reportedly, modelled on Marseille's covered market. It stands on the stump of a Venetian bastion called Piatta Forma, so the town's shopping floor replaced a defence. Prime Minister Venizelos opened it on 4 December 1913, three days after Crete united with Greece. Four wings, 76 shops, and traditionally butchers, fishmongers, greengrocers and cheese and herb sellers under one roof. It is closed for restoration today (reopening announced for 4 December 2026), so look from outside, then walk north-east about 7 minutes to Splantzia.","long":"You are standing at a building with its doors shut, and that is fine; the outside tells most of the story. The Municipal Market is a cross, with four wings and an entrance facing each point of the compass, 76 shops grouped around the arms. Building began in 1911, and several tourism sources say the plan was modelled on the covered market of Marseille, which I would treat as a repeated claim rather than a proven one. It is closed for restoration, with its reopening announced for 4 December 2026, so you are seeing the shell of a place that is normally loud.\n\nStart with what is underneath. The hall stands on the remains of a Venetian bastion called Piatta Forma, part of the line of walls on the eastern side of the city. To make room, part of the walls were demolished, one piece of the early 20th century's clearing of the old defences as the town outgrew them. That is a fine fact for a household historian: the wall that kept 16th-century families in was removed so that 20th-century families could shop. Behind the walls the town was cramped. Outside them there was space for a building with air, light and running water, which in those years counted as civic virtue. A single hall with standard stalls replaced scattered street markets, and the idea was public hygiene and civic pride in a brand-new Greek town.\n\nThe timing matters. The Greek flag went up at Firkas on 1 December 1913, the formal moment of Crete's union with Greece, and three days later Eleftherios Venizelos, who was born just outside Chania and by then was Prime Minister of Greece, came home to open the market. Whatever else it was, a covered market was a statement: this was now a modern city in a Greek state. A household in 1913 had changed flags without moving house. The people who bought bread, cheese and fish here had been Ottoman subjects, then residents of an autonomous Cretan State under four Great Powers for 15 years, and were now Greek citizens.\n\nThink about what a market is for in a household. The wings were traditionally divided by trade: butchers, fishmongers, greengrocers, and sellers of cheese and herbs. Which wing held which trade is not recorded in anything easy to check, so take the layout loosely. But the principle is the point. Someone from each household walked the arms of the cross with a basket, knowing which stall had good mizithra (the soft fresh cheese that goes on dakos, the barley rusk with tomato), and who would weigh fairly. Crete's food has always depended on that kind of knowledge: wild greens (horta) from the hills, olive oil from the family trees, snails after rain, cheese pies called kalitsounia. When you eat later, you will see how much of it does not come from a shop at all.\n\nNow stand back and use this spot to set up the layers of the town, because everything else today stacks on them. Under the hill ahead of you, Kastelli, lies Minoan Kydonia. Then came Greek and Roman Kydonia (the Romans took Crete in 69 BC). Then Byzantine rule, interrupted by the Arab Emirate of Crete from 824 to 961, when Nikephoros Phokas took the island back. In 1252 Venetian colonists founded La Canea on the old site, and Venice held it until 1645, when the Ottomans took the city after 56 days. Ottoman rule lasted until 1898, with a short Egyptian interlude from the 1830s to 1840. Then came the Cretan State, with Chania as its capital, from 1898 to 1913, and then Greece. Each change in that list altered something for a different group: who paid which tax, which building was a church and which a mosque, who could own land near the harbour, who had to leave. The rest of the morning is about those changes seen through ordinary lives.\n\nIf the wind is strong, you will feel it funnel along the street here. Keep going. Walk north-east, with the sea on your left and the old town on your right, for about 7 minutes to Splantzia, a square with a plane tree and, on its church, both a minaret and a bell tower. Coffee is waiting under the tree, and so is the story of what happened to a quarter of the city in 1923."},{"n":3,"slug":"splantzia","title":"A Minaret and a Bell","short":"You are in Plateia 1821, Splantzia, the old Muslim quarter. The church in front of you, Agios Nikolaos, was built around 1320 by Dominican friars, became the Sultan's mosque after 1645, and has been Orthodox again since 1918. It wears a minaret (about 36 m) and a bell tower added in the 1950s, reportedly a combination found nowhere else in Greece. Neighbours here spoke the same Greek and prayed in different buildings, until the 1923 population exchange sent the Muslim families away. The big plane tree has a hanging story that is legend. Coffee at Platanos, then 4 minutes west, uphill, to Kastelli.","long":"You are in Plateia 1821, in the district called Splantzia, from the Venetian word for piazza. The big plane tree is in front of you, tables for coffee are under it, and across the square stands a church with a tall round minaret next to a bell tower. That odd pairing is the whole story of the neighbourhood in one building.\n\nThe church is Agios Nikolaos. Dominican friars built it around 1320 as a Roman Catholic monastery church, in the Venetian period, when the Dominicans of Candia ran a brotherhood here. After the Ottomans took the city in 1645, it was one of three churches converted into mosques right away, and it became the Hünkar Camii, the Sultan's Mosque, named for Sultan Ibrahim, who had launched the war. The cylindrical minaret is about 36 m tall, and with its lost conical cap it would have topped 40. In 1918 it was reconsecrated as an Orthodox church dedicated to St Nicholas. The bell tower was added in the 1950s. It is often called the only building in Greece with both a minaret and a bell tower; that is widely repeated rather than proven. Today it is a working church, usually open in the daytime outside services, free to enter, and worth a quiet look if you are dressed for it.\n\nNow think of the square on an ordinary morning in, say, the 18th century. Splantzia was the heart of the Muslim quarter; Topanas, to the west, was the Christian quarter, and the Jewish quarter, Evraiki, lay near it, a few streets away. But the labels flatter the neatness. Many of the Muslims here were Cretans whose families had converted over the generations after 1645, and they spoke Greek. They ate the same food, followed the same seasons, and heard the same music as their Christian neighbours. The difference was which building they entered on Friday or on Sunday, what taxes they paid, and what the law allowed them. A tradition says the small church of Agioi Anargyroi, just off the square, was the only place Orthodox Christians were allowed to worship in the city; that is a tradition, not a checked fact, so hold it loosely. What the pattern suggests is how life under a conquering faith got organised day to day: you negotiated it. Households found workable arrangements with the neighbours on both sides of the wall.\n\nThe plane tree has its own tale, and it needs a warning label. Local tradition says Ottoman authorities hanged Orthodox clergy and rebels from it, and that the bishop of Kissamos, Melchisedek Despotakis, was hanged here in 1821. That is the sort of story that gets repeated because it feels right, and the record does not confirm it. Treat it as legend. What is solid is that 1821, the year the Greek revolution began, gave this square its name, and that Crete's part in that revolution brought reprisals and rebellion over and over, through the long chain of revolts in the 19th century.\n\nThen comes 1923, the part for the quiet minute. Under the Treaty of Lausanne, Greece and Turkey exchanged populations by religion. Most Cretan Muslims left, many of them families who had lived here for generations and had never lived anywhere else, speaking Greek to the last. The houses were taken over by Orthodox refugees from Asia Minor, who were leaving their own homes and had also lost everything. Neither group had much choice, and both were households trying to start again with a few bags. When you look at the minaret, remember the community it was built for, here for centuries and then gone.\n\nPlatanos, on the square, is good for coffee or a raki under the tree, facing the church and minaret. After a meal in Crete, raki is often brought free, so the habit of hospitality has outlasted every change of flag. If the weather is turning, shelter under the tree's canopy for a minute or step into the church.\n\nWhen you are ready, head about 4 minutes west, uphill, to Kastelli hill. Be ready for something much older: the layer under the layers, where a Bronze Age kitchen is waiting behind a fence."},{"n":4,"slug":"kastelli","title":"The Kitchen Under the Hill","short":"You are on Kastelli hill, over Minoan Kydonia. Through the fence at Agia Aikaterini square is a house from about 1450 BC, destroyed by fire. In its kitchen archaeologists found a clay hearth with a loom beside it and a jar of about 3 kg of burnt lentils and vetch. The fire baked clay tablets hard: about 99 Linear A accounts, plus sealings that locked jars and doors. A later Linear B tablet records honey for Zeus and Dionysos, a receipt for gods. The quince is named for the town. Walk down about 4 minutes to the Neoria on the east harbour.","long":"You are standing on top of a Bronze Age town. Kastelli hill, the low rise behind the harbour, has been lived on almost without a break for about 5,000 years; the one gap is roughly 1150 to 735 BC. Walk to Agia Aikaterini square, on Kanevaro Street, and look through the fence. Under a protective roof built in 2005 to 2008 is a patch of excavation about 600 m² in area, with around 2 m of layers stacked up. Digs began in 1964, and from 1970 the Greek-Swedish excavation took over.\n\nThe house you are looking at is called Building 1. It covered 225 m², had two storeys and 14 rooms on the ground floor, with streets and small squares around it. Now the detail I would walk a long way for. In a kitchen, archaeologists found a clay hearth with a loom beside it. In a jar there were about 3 kg of burnt legumes, vetch and lentils or peas, carbonised where they sat. Someone was cooking and weaving in the same room. Then, around 1450 BC, a fire swept through, part of a Crete-wide wave of destruction. The lentils never made it to dinner.\n\nThe fire left something else. Clay tablets, which would normally be dried in the sun and then crumble, were baked hard, so that about 97 to 99 Linear A tablets, found in 1973, survive from here, the second-largest archive of this script after Hagia Triada. Most are records of farm produce and livestock. Linear A has never been deciphered, so here is the oddity: we can read the numbers and some commodity signs, so we can read the accounts, but not the words. We can count the sheep and cannot say their names. Alongside the tablets were clay sealings, lumps pressed with a seal and stuck over the string on a jar, box or door, so that anyone could tell if it had been opened. One clay bar carries twelve impressions from ten different seals. That is bureaucracy in clay: someone checked who opened the storeroom.\n\nThe most famous find is the Master Impression, a sealing from the second half of the 15th century BC. It shows a long-haired male figure in a kilt, holding a staff or spear, standing over a multi-storey walled town on a rocky shore, with windows and horns of consecration on the buildings. The gold ring that made it has never been found. Scholars argue whether the figure is a ruler or a god, and whether the town is Kydonia; none of that can be proved. Note the walls: they sit awkwardly with the old idea of a peaceful Minoan Crete, itself contested.\n\nJump forward about two centuries. In 1989 and 1990 archaeologists found five Linear B tablets here, in the Greek of Mycenaean Crete, dated to the 13th century BC. One, called KH Gq 5, records honey. The reading is roughly: to the sanctuary of Zeus; to Zeus, honey, 1 amphora; to Dionysos, honey, 2 amphorae. Two later Greek gods, written together, with Dionysos getting double. That is religion as lived practice and as household economy: offerings budgeted on the same kind of clay as sheep and wool. (That it shows Dionysos already as Zeus's son is a guess, not a finding.)\n\nKnossos is where the name of the town is securely written: Knossos scribes wrote ku-do-ni-ja in their records. No tablet found here has yet been shown to carry the name, so the safe claim is that Knossos knew this town. Inscribed jars from west Crete turned up at Thebes, traced by clay analysis. At Knossos, the tablets list named women as textile workers on rations; women clearly worked and took part in ritual. Whether they ruled is unknown, and the Minoan matriarchy of popular books is a modern idea, not a finding.\n\nThe town gave the world a fruit: the Greeks called the quince the Kydonian apple, and the botanical name Cydonia comes from it (a few linguists suspect an older word was bent to fit the town). Homer mentions the Kydonians, and the founder, King Kydon, is a myth with several versions. The Minotaur belongs to Knossos.\n\nOn top of all this the Byzantines built a wall in the 10th century and the Venetians made the hill their Castello, where nobles and officials lived, while Greek artisans and fishermen lived outside until the new walls of 1536 to 1568 enclosed them. Now go down, about 4 minutes, to the east harbour and the long stone sheds of the Neoria."},{"n":5,"slug":"neoria","title":"Sheds for the Winter Fleet","short":"The long arched sheds along the south side are the Venetian Neoria, shipyards built from 1526 to 1599: 17 vaults here, five more (the Moro yards) on the east side, so about 22 in all, though some sources say 23. Each hall is about 50 m long, with an open sea end so galleys could be hauled in to be built, mended and kept dry for winter. In 1645 the Ottomans found 12 galleys inside. In a Moro yard sits Minoa, a lashed, nail-free replica of a Bronze Age ship rowed to Piraeus in 2004. The lighthouse is about 10 minutes out along the breakwater.","long":"Look at the row of long, arched stone sheds on the south side of the harbour. These are the Neoria, the Venetian shipyards, and they are one of the few places on this walk where you can see a whole working industry standing in front of you. The first two were finished in 1526. By 1593 there were 16, and the 17th completed the south range in 1599. A few years later five more, the Moro yards, were added on the east side of the harbour, where you are heading. That makes about 22 in all, though some sources say 23, and I would not pick one as certain. A row of seven vaulted halls survives together, with one more farther west, the Grand Arsenal, which now houses the Centre of Mediterranean Architecture.\n\nThe size is the point. Each hall was about 50 m long, 9 m wide and 10 m high, with arched openings in the side walls linking the halls, and the seaward end left open. Galleys could be hauled straight in on slipways. Inside, they were built, repaired, and kept through the winter, out of the storm season and safe from corsairs.\n\nWho worked here? The sources are thin on names, so this is a reasonable inference and not a record: shipbuilding on this scale meant carpenters, caulkers, rope-makers and oarsmen, and a ship under repair needed people who could cut timber, drive and seal planks, spin and tar rope, and make sails. It was probably the town's biggest employer, and many families would have lived near it because of that.\n\nWhen the city fell in 1645, the Ottomans walked into the arsenal and found 12 Venetian galleys sitting in the sheds. The building outlived its owners. Later uses reportedly included Ottoman and Egyptian military stores and then 20th-century warehouses and workshops, though the details are thin. Now a war factory is, in part, an architecture centre. It kept finding new work.\n\nThe Moro shipyard at the east end holds the thing I most want you to see. Minoa is an experimental replica of a Minoan ship of the 16th to 15th centuries BC, about 17 m long and about 4 m wide. It was built from 2001 to 2004 of split cypress planks lashed and sewn together, not nailed, with oars and a single square sail. The design drew on ship images such as the Akrotiri flotilla fresco on Santorini and on seals. In 2004 it was rowed and sailed some 210 nautical miles from Chania to Piraeus for the Athens Olympics, meeting the Olympic flame at the end. The annex is part of the Maritime Museum, entry about 3 euros, and open until 31 October; the Maritime Museum itself has its own hours and a separate ticket, and you will pass it later.\n\nStand next to a hull like that and think about the household around it. Someone has to cut the cypress, split the planks, make the rope that lashes them, weave the sail, and feed the crew who will row. And this is where an old Greek source gives us a line to hold lightly. Thucydides says Minos was the first to build a navy and that he cleared the sea of pirates so his revenues could come in. Whether there was ever a Minoan naval empire is argued over; scholars today tend to prefer the picture of trade and cultural influence. But the Minoan ships were real, the exported jars from this town turned up on the mainland, and the sea is the island's long constant.\n\nIf the weather is dry enough, now go out along the breakwater to the lighthouse, about 10 minutes away. The stones can be wet and slippery, and spray may come over; if so, skip it and take the view from the quay. The lighthouse looks a bit like a minaret, and there is a reason for that, which comes next."},{"n":6,"slug":"lighthouse","title":"The Tower at the Harbour Mouth","short":"You are at the end of the breakwater, beside a tower with an octagonal base, a 16-sided middle and a round top. Someone has to tend a light like this, and the harbour behind you is the reason it exists: boats, cargo and fishing families all depended on getting in past these rocks. Venice built the first light here in the late 16th century. The tower you see was rebuilt in the 19th (local accounts say about 1839, under Egypt; other sources say 1864), and its shape is why people call it minaret-like. Look back at the waterfront: that is the working town, seen from the sea. If the spray is coming over, turn around here. Back along the breakwater and round the harbour, about 15 minutes, is the domed mosque.","long":"You are at the end of the breakwater, standing beside the lighthouse. Look up at the tower: an octagonal base, a 16-sided middle section and a round top, built of stone with a stair inside. If the sea is coming over the wall and the stones are wet, this is the moment to turn back, because the path here is uneven and nobody needs a photograph that badly. If it is safe, you are about 600 metres from where the breakwater begins, and you are standing in a place that exists for one reason: to get ordinary working boats home.\n\nThink about who that meant. A harbour like this is not mostly about the grand ships. It is about the caique that left before dawn and has to find the gap between the rocks in a north wind, the cargo boat with oil or wine or cloth, the porter waiting on the quay, the customs man, the wife who watches the horizon from a kitchen window. A light is a promise made to all of them. Venice built the first one at the end of this breakwater in the late 16th century, usually dated 1595 to 1601. After the Ottoman conquest in 1645 it fell into neglect, which tells you something about priorities: when the flag changes, the soldiers and tax collectors arrive first and the maintenance budget comes later.\n\nThe tower you see is a 19th-century rebuild, and sources disagree on when. The most common local account puts it around 1839, during the ten years (1830 to 1840) when Crete was ruled from Egypt by Mehmet Ali, which is why it is sometimes called the Egyptian lighthouse. Other sources say 1864. I would hold both dates in your head and not choose. Either way it was built under a regime that was not Venetian and not yet Greek, and its octagon and stair gave it the look of a minaret. It is a good example of how a practical building quietly outlives the people who commissioned it.\n\nThe Egyptian decade itself is worth a sentence. It was short and odd: some tax reforms, some public works, a rebuilt lighthouse, and also unrest. For most households the question was the one it always is when rulers change: who collects the tax, and how much is left on the table. A fixed white light was installed in May 1915, making this an official lighthouse of the Greek service, two years after Crete joined Greece. Today it flashes red every 2.5 seconds, visible about 7 nautical miles out. It was damaged in the Second World War and restored in 2005 to 2006. Nothing I can point to names the keepers or harbour workers of any period, so I will not invent them; but a light like this needs someone to climb that stair, and that is worth picturing as you stand here.\n\nThere is an older kind of care on this coast, too. West of Chania, on the tip of the Rodopou peninsula, lies the sanctuary of Diktynna, whose name comes from the Greek word for a net. The legend says she threw herself from a cliff to escape King Minos and was caught in fishermen's nets, and became their goddess. That is a myth, and the sanctuary's oldest finds date only from the late 7th or 6th century BC, so it is not shown to be Minoan. But it is a lovely detail: a goddess whom fishing families prayed to, because the net was how they ate.\n\nNow turn and look back. This is the best view of the whole waterfront, and what you are really seeing is the working street of the town: the quay, the mosque dome, the old shipyards, the houses stacked behind. For generations the walk out here has been a family ritual, an evening stroll along the sea wall. Notice who is walking it today, in whatever weather you have been given.\n\nWhen you are ready, head back along the breakwater and then round the harbour. It is about 15 minutes along the quay to the low domed mosque, the next stop."},{"n":7,"slug":"mosque","title":"The Neighbours' Mosque by the Sea","short":"The squat building with the big dome and a row of small domes over its porch is the Kioutsouk Hasan mosque, also called Yiali Tzamisi, the Seaside Mosque. It went up from 1645, right after the Ottoman conquest, and is usually called the oldest surviving Ottoman building on Crete. The minaret is gone. Imagine it as a neighbourhood fixture on the quay: prayer, coffee and trade within a few steps of each other. After 1923 it was a warehouse, a museum and a tourist office; now it opens only for exhibitions, so look for a sign. It is named for Küçük (Little) Hasan Pasha, the first Ottoman commander. Walk west along the harbour, about 5 minutes, to Firkas.","long":"You are standing in front of the Kioutsouk Hasan mosque, called Yiali Tzamisi by the Greeks, the Seaside Mosque. It has a large hemispherical dome on four great arches and a row of smaller domes over the porch (sources count six or seven, so count them yourself). There was a minaret; it was demolished in the 20th century, in the 1920s or by 1939 depending on whom you read. It opens only for temporary exhibitions, so check the door, but the building is the point from outside anyway.\n\nIt was built from 1645, straight after the Ottoman conquest, and is usually called the oldest surviving Ottoman building on Crete. Some sources say 1645 and others 1645 to 1649, and the name is Küçük, \"Little\", Hasan Pasha, given as the first Ottoman commander of the city. It is also known as the Mosque of the Janissaries. Tradition names an Armenian architect; treat that as a story rather than a record.\n\nFirst, how the town got here. In 1644 the Knights of Malta captured an Ottoman ship, reportedly carrying a member of the Sultan's harem, and put in on Crete. Sultan Ibrahim blamed Venice. The Ottoman fleet left Istanbul on 30 April 1645, reached Chania in late June, and the siege lasted 56 days (some sources say 54 or 57), ending on 22 August. Roughly 50,000 men and 416 ships came against about 12,000 defenders, mostly local militia rather than professional soldiers. A commander named Blasio Zulian held the little fort on the islet offshore with 30 men and chose to blow it up with himself and them inside rather than surrender. The Venetian garrison, and townspeople who wished to leave, were evacuated unharmed to Souda. The war moved on to Candia (Heraklion), where it lasted about 21 years.\n\nNow the part that matters for Jamie's way of looking: what a conquest means on an ordinary street. Straight after the surrender, three churches in Chania became mosques. Venetian families who could go, went. An Ottoman garrison of about 8,000 stayed, and a garrison is not just soldiers; it is bakers, boatmen, coffee sellers, tailors, women running households, children underfoot. A mosque built on the quay, where the Venetian galleys had once tied up, did several jobs at once. It was a place to pray five times a day, but also a landmark, a meeting point and a sign of who now ran the harbour. I should be honest: what survives is the building and its dates, not a record of daily life around it. But it is reasonable to picture the quay as a working street, with fishermen, porters, coffee houses and customs men within earshot of the call to prayer.\n\nThe population that used it was more mixed than the word \"Ottoman\" suggests. Over the following generations many Cretans converted, and Muslims in Chania were often Greek-speaking Cretans, living next to Orthodox Christians and a Jewish community in a quarter of their own. Splantzia, where you stood earlier, was the Muslim quarter; Topanas, where you are going, was the Christian one. They shared a language, a cuisine and a good deal of music, and prayed in different buildings. That ended abruptly in 1923. Under the population exchange following the Treaty of Lausanne, most Cretan Muslims left, and the mosques lost their congregations almost overnight.\n\nWhat happened to this building afterwards reads like a list of the city's priorities. It became a warehouse, then the Archaeological Museum, then an office of the Greek Tourism Organisation. It now belongs to the Port Fund, and is used for exhibitions. A building that outlasts its original purpose usually survives because it is useful, and it has been useful to every regime since.\n\nStand with your back to the sea for a moment and look at the dome, then at the harbour, and then at the people walking past. Then continue west along the waterfront. It is about 5 minutes to Firkas, the fortress at the harbour's western mouth."},{"n":8,"slug":"firkas","title":"Barracks, Prison and a Flag","short":"Before you is Firkas, the Venetian bastion at the western mouth of the harbour. Its name comes from the Turkish firka, barracks, and under the Ottomans it was a barracks and a prison: hundreds of men eating, sleeping and waiting inside these walls. On 1 December 1913 the Greek flag went up here for Crete's union with Greece. Today it holds the Maritime Museum of Crete (09:00 to 17:00, 4 euros), with Bronze Age ship models, Venetian galleys and a Battle of Crete gallery. Look for the caique tools and nets: that is a fishing family's living. From here walk about 5 minutes south into Topanas and the old Jewish quarter.","long":"You are at Firkas, the fortress at the west end of the harbour. It was built in 1620, next to the San Salvatore bastion at the north-west corner of the walls, to guard the harbour mouth. The name is the giveaway about what came next: firka is Turkish for barracks, and under the Ottomans this was a barracks and a prison. The museum inside, the Maritime Museum of Crete (open 09:00 to 17:00, 4 euros), was founded in 1973.\n\nPicture the place in use. After 1645, about 8,000 soldiers were left to hold Chania, and they had to be housed, fed and kept in order somewhere. A garrison eats grain and meat and oil every day, wears out boots, needs water and fuel and bread. The same buildings held prisoners, and a prison, then as now, was a household of its own: someone had to feed the inmates, and in many places in the period that fell partly to their families, who came to the gate with bread. I cannot document that for Firkas, so treat it as the general pattern rather than a local fact. What I can say is that every flag that flew here relied on ordinary people to keep it supplied.\n\nThen the long unravelling. The 19th century brought a run of Cretan revolts: 1866 to 1869 (remembered most for Arkadi monastery, near Rethymno, where defenders blew up their powder store rather than surrender), then 1878, 1889 and 1895 to 1897. In each, villages emptied. Women and children took shelter in monasteries, and families had a man up in the mountains. The 1878 Pact of Halepa gave Crete limited home rule, a rare case of a revolt leading to paperwork that actually changed how people were governed.\n\nIn 1898 the Great Powers (Britain, France, Russia and Italy) set up the autonomous Cretan State, with Chania as its capital. That is why the town had cons
