ate is 1 December 1913. Under the Treaty of London of 30 May 1913 the Ottoman Empire gave up its rights to Crete, and on this fortress the Greek flag was raised, with King Constantine and Venizelos attending. Three days later, on 4 December, Venizelos opened the new Municipal Market, which you saw this morning, so that the flag came first and the shops after, as if a fresh political identity needed a modern place to buy cheese and fish.\n\nThe changes fell differently on different people. For Orthodox families the end of Ottoman rule meant an end to second-class status, and for Cretan Muslims it began the last years before the 1923 exchange. The capital stayed in Chania until 1971, when it moved to Heraklion.\n\nIf the weather is bad, the museum is the place to go in. The Bronze Age room has models of Minoan ships and finds from underwater archaeology, alongside Venetian galleys and a section on traditional boatbuilding, with caiques, nets and tools that show how a fishing or boatbuilding family made a living under all the flags. The Battle of Crete gallery is about civilians as much as soldiers, since Cretan villagers fought paratroopers with whatever they had. Entry is 4 euros, and it closes at 17:00.\n\nWhen you come out, walk about 5 minutes south, away from the water, into Topanas, the Venetian nobles' quarter and later the Christian quarter, just beyond which is the old Jewish quarter, Evraiki."},{"n":9,"slug":"synagogue","title":"The Courtyard of Evraiki","short":"You are in the lanes of Evraiki, the old Jewish quarter, at the Etz Hayyim synagogue on Parodos Kondylaki. It began as a Venetian church and became a synagogue in the 17th century, and a community prayed, studied and lived there for centuries beside Christian and Muslim neighbours. In May 1944 the Germans arrested Chania's Jews, about 250 to 275 people, and on 9 June the ship carrying them, the Tanais, was sunk by a British submarine that did not know who was aboard. The building was restored and reopened in 1999, and today it is open until 15:00 (4 euros, with a short tour); please photograph the building only. Lunch is two minutes away at Tamam.","long":"You are at Etz Hayyim, on Parodos Kondylaki, in the streets of Evraiki, the Jewish quarter of Chania, a place that asks for quiet and an unhurried visit. It is open today until 15:00; entry is 4 euros, which includes a short tour with the staff, and they ask that you photograph the building only, with no selfies. The tour is worth taking if you can.\n\nThe building began as a church in the Venetian period and became a synagogue in the 17th century, after the Ottoman conquest, and a Jewish community lived in this quarter under both the Venetians and the Ottomans. It was a Romaniote community, one of the Greek-speaking Jewish traditions, whose roots on Crete are described as going back to antiquity, though what can be said with confidence here is limited to what is documented and what the place itself shows. A synagogue in a small quarter is usually more than a room for prayer, being also where the community gathers for the big moments of life. The courtyard, the garden and the mikveh, the ritual bath, show that this was a house of daily life as well as worship.\n\nWhat the visit makes plain is how normal it was. For centuries Jewish families in Chania lived in a mixed town, a few streets from Splantzia's Muslim quarter and Topanas's Christian one, trading in the same markets, speaking the same Greek and keeping their own calendar of festivals.\n\nOn 29 May 1944, during the German occupation, soldiers rounded up the Jews of Chania, about 250 to 275 people (another account gives 276 arrested on 20 May, so sources differ on the exact date and number). They were taken by truck to Heraklion and put on board a ship, the Tanais, together with Greek hostages, resistance prisoners and Italian prisoners of war, and on 9 June 1944 the British submarine HMS Vivid fired four torpedoes at about 2,400 yards. Two hit, and the ship sank in about 12 seconds, north-west of the islet of Dia, with the crew of the Vivid unaware of who was aboard. Estimates of the dead run from 425 to 1,000, about 265 of them Cretan Jews, and the sinking ended Crete's Jewish community. The Tanais had been sunk once before, by the Luftwaffe in Souda Bay in May 1941, and then raised and repaired. A memorial to the victims stands in Chania, and the town marks the anniversary each June.\n\nAfter the war the synagogue was a ruin, and it was restored in the late 1990s, with Nikos Stavroulakis leading the work, and reopened in 1999. Arsonists attacked it on 5 and 16 January 2010, and the second fire destroyed about 2,500 rare books and manuscripts, after which it was repaired again. Today the congregation is mostly non-Jewish, follows Sephardic customs and has written its own Haggadah, so that in effect people who live here look after a house of prayer whose own community is gone. In 2006 Queen Sofia of Spain and the former King Constantine II visited unannounced.\n\nIf the staff show you the memorial plaque, it lists the deported families by name, a reminder of the households behind a day otherwise given to cannon and flag.\n\nTake a moment in the courtyard, then go to lunch at Tamam, on Zambeliou, about two minutes away in a former hammam (Ottoman bath), where the Cretan-Ottoman cooking indoors suits this weather. After lunch, a taxi east to the Archaeological Museum at Chalepa is kinder in the rain than the 25-minute walk."},{"n":10,"slug":"museum","title":"The Ledger and the Hearth","short":"This is the Archaeological Museum of Chania at Skra 15, Chalepa, open 08:00 to 20:00 (15 euros with audio guide), which opened in 2022. Its best pieces are small: the Master Impression, a tiny clay sealing from Kastelli, and the tablets, Linear A accounts and a Linear B tablet recording honey for Zeus and Dionysos, which are household and temple bookkeeping. There is also a painted clay coffin from Armeni (a cemetery near Rethymno) and everyday Minoan pottery, and together they show people keeping stores, counting them and feeding their gods, the thread running through the whole day. Take a taxi back to Souda in time for the ship by 18:00.","long":"You are at the Archaeological Museum of Chania, at Skra 15 in Chalepa, which opened in April 2022 to replace the old museum in the Venetian church of San Francesco in the old town. It is open 08:00 to 20:00, with entry at 15 euros including an audio guide, and if you are wet and tired you have chosen well. The floor plan at the entrance is worth checking, since the rooms may be arranged differently from what is described here.\n\nThe best pieces are small, and almost all of them concern the management of a household, which links them to the Minoan town on Kastelli hill that you stood above this morning. The sealings are lumps of clay stamped with a seal and pressed onto jar stoppers, boxes and doors, so that anyone opening a storeroom had to break the seal; the excavation turned up a clay bar bearing twelve seal impressions from ten different seals. Then comes the Master Impression itself, a tiny sealing a few centimetres across showing a tall figure over a walled, multi-storey town by the sea. The gold ring that made it has never been found, and whether the figure is a ruler, a god or a ruler shown as divine is argued over, so it is best left unsettled.\n\nThe tablets come next. Kydonia produced something like 97 to 99 Linear A tablets, the second-largest archive of that script after Hagia Triada, mostly records of farm produce and livestock, and they survive because the fire around 1450 BC baked them hard. No one can read Linear A as language, but the numbers and some commodity signs can be read, so the accounts can be followed without the words. If it is on display, a Linear B tablet records honey, roughly \"to Zeus, honey\", one amphora, and \"to Dionysos, honey\", two. It is about 800 years older than classical Greek drama, and it shows religion as a line in the household budget, written on the same kind of clay as sheep and wool. The idea that it proves Dionysos was already Zeus's son is an inference, and a debated one.\n\nThe kitchen seen through the fence earlier, with a clay hearth and a loom beside it and a jar holding about 3 kilograms of burnt lentils and vetch, belongs with these records. The hearth, the cloth and the clerk upstairs counting make a household together. In Linear B records from Knossos, textile workers appear by name on ration lists, women and children among them, so that women's work was real and measured, although whether women held political power is unknown and the \"matriarchy\" idea is a modern projection, not evidence.\n\nThe larnakes, painted clay coffins, include one decorated with a hunting scene; it comes from a cemetery at Armeni, near Rethymno, not Chania, and dates like the others to 1400 to 1200 BC. The pottery includes the \"Kydonia workshop\" wares of the 13th century BC and large inscribed stirrup jars, oil or wine jars painted in Linear B. Clay analysis traces them to west Crete, and some turned up at Thebes; a jar like that is the Bronze Age equivalent of a shipping label. Beyond them are the later cities, Greek and Roman Kydonia, laid down in layers.\n\nChalepa itself adds a last point. In the Cretan State, from 1898 to 1913, this eastern district was where consuls and the prince's court lived, and the Venizelos house is here. While the old town's harbour had galleys and then a garrison, Chalepa had a tidier world of diplomats and lawyers' households, each era arranging its people differently.\n\nThe day closes where it began, with the people under the hill who counted their oil, wove their wool and gave honey to the gods. The Venetians built their shipyards, the Ottomans their mosques and the town its market and its synagogue, and underneath them the same questions about storage, work and neighbours kept coming round.\n\nTo go home, a taxi from here to Souda is the easiest way to be back on the ship before 18:00, and in the rain it is wise to allow plenty of time and a margin."}]};
const PLACES = {"souda":"Souda Bay (the cruise quay)","agora":"Market Hall (Agora), the shuttle end","splantzia":"Splantzia: Plateia 1821 and Agios Nikolaos","kastelli":"Kastelli hill: Minoan Kydonia","neoria":"The Venetian shipyards (Neoria) and the ship Minoa","lighthouse":"The lighthouse","mosque":"Kioutsouk Hasan mosque (Yiali Tzamisi)","firkas":"Firkas fortress and the Maritime Museum of Crete","synagogue":"Etz Hayyim synagogue","museum":"Archaeological Museum of Chania (Chalepa)"};
const NAMES = {rob:'Rob', jamie:'Jamie'};
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const FS = [15,16,17,18,19,20,22,24,26,28];
let who='rob', idx=0, len='long';
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pressed(sel,attr,val){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String((b.dataset[attr]||'')===val)));}
function applyFont(){const fs=Number(store.get('chaniaFont',19));document.documentElement.style.setProperty('--fs',fs+'px');document.getElementById('fsdown').disabled=fs<=FS[0];document.getElementById('fsup').disabled=fs>=FS[FS.length-1];}
function stepFont(d){const fs=Number(store.get('chaniaFont',19));let i=FS.indexOf(fs);if(i<0)i=4;i=Math.max(0,Math.min(FS.length-1,i+d));store.set('chaniaFont',FS[i]);applyFont();}
function applyTheme(){const t=store.get('chaniaTheme','');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');pressed('.sheet [data-theme]','theme',t);}
function setLen(l){len=l;store.set('chaniaLen',l);pressed('.bar [data-len]','len',l);render();}
function parseHash(){const m=location.hash.match(/^#(rob|jamie)(?:\/([a-z0-9-]+))?/);if(m){who=m[1];const k=m[2]||'';const bySlug=STOPS[who].findIndex(s=>s.slug===k);idx=bySlug>=0?bySlug:(/^\d+$/.test(k)?Math.max(0,Math.min(STOPS[who].length-1,Number(k)-1)):Number(store.get('chaniaPos:'+who,0))||0);return;}const q=new URLSearchParams(location.search).get('as');who=(q==='jamie'||q==='rob')?q:store.get('chaniaWho','rob');if(!(who in STOPS))who='rob';idx=Number(store.get('chaniaPos:'+who,0))||0;}
function go(w,i,opts){opts=opts||{};if(!STOPS[w]||!STOPS[w].length){document.getElementById('main').innerHTML='<p>The stops have not loaded. Pull down to reload.</p>';return;}who=w;idx=Math.max(0,Math.min(STOPS[w].length-1,i));store.set('chaniaPos:'+w,idx);store.set('chaniaWho',w);const h='#'+w+'/'+STOPS[w][idx].slug;if(opts.push===false)history.replaceState(null,'',h);else history.pushState(null,'',h);render();window.scrollTo(0,0);}
function num(s){return String(s.n).padStart(2,'0');}
function words(t){return (t||'').split(/\s+/).filter(Boolean).length;}
function render(){
  const list=STOPS[who], s=list[idx];
  document.getElementById('whoname').textContent=NAMES[who];
  document.getElementById('mapbtn').href='index.html#at/'+s.slug;
  document.title=`${num(s)} ${s.title} · ${NAMES[who]} · Chania Landfall`;
  const text=len==='short'?s.short:s.long;
  const head=`<div class="eyebrow">${NAMES[who]}'s track · stop ${s.n} of ${list.length} · ${len==='short'?'short':'long'} · ${Math.max(1,Math.round(words(text)/200))} min read</div><h1>${esc(s.title)}</h1>${PLACES[s.slug]?`<p class="place">${esc(PLACES[s.slug])}</p>`:''}`;
  const body=text.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
  const foot=`<div class="foot ui"><button type="button" id="prev" ${idx===0?'disabled':''}>‹ ${idx>0?esc(list[idx-1].title):'Start'}</button><button type="button" id="next" ${idx===list.length-1?'disabled':''}>${idx<list.length-1?esc(list[idx+1].title):'End'} ›</button></div>`;
  document.getElementById('main').innerHTML=head+body+foot;
  document.getElementById('prev').onclick=()=>go(who,idx-1);
  document.getElementById('next').onclick=()=>go(who,idx+1);
  pressed('.sheet [data-who]','who',who);
  buildToc();
}
function buildToc(){const ol=document.getElementById('toc');ol.innerHTML='';document.getElementById('sheettitle').textContent=NAMES[who]+"'s track";STOPS[who].forEach((s,i)=>{const li=document.createElement('li');li.setAttribute('aria-current',String(i===idx));li.innerHTML=`<button type="button"><span class="n">${num(s)}</span><span class="t">${esc(s.title)}</span><span class="d">${Math.max(1,Math.round(words(s.long)/200))} min</span></button>`;li.querySelector('button').onclick=()=>{closeSheet();go(who,i);};ol.appendChild(li);});}
function openSheet(){buildToc();document.getElementById('sheet').hidden=false;}
function closeSheet(){document.getElementById('sheet').hidden=true;}
document.getElementById('tocbtn').onclick=openSheet;
document.getElementById('closesheet').onclick=closeSheet;
document.getElementById('fsdown').onclick=()=>stepFont(-1);
document.getElementById('fsup').onclick=()=>stepFont(1);
document.querySelectorAll('.bar [data-len]').forEach(b=>b.onclick=()=>setLen(b.dataset.len));
document.querySelectorAll('.sheet [data-who]').forEach(b=>b.onclick=()=>{const w=b.dataset.who;closeSheet();go(w,Number(store.get('chaniaPos:'+w,0))||0);});
document.querySelectorAll('.sheet [data-theme]').forEach(b=>b.onclick=()=>{store.set('chaniaTheme',b.dataset.theme||'');applyTheme();});
window.addEventListener('popstate',()=>{parseHash();render();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(who,idx+1);if(e.key==='ArrowLeft')go(who,idx-1);});
let tx=null,ty=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=ty=null;if(!document.getElementById('sheet').hidden)return;if(Math.abs(dx)>90&&Math.abs(dy)<60){if(dx<0)go(who,idx+1);else go(who,idx-1);}},{passive:true});
applyFont();applyTheme();
len=store.get('chaniaLen','long');pressed('.bar [data-len]','len',len);
parseHash();
go(who,idx,{push:false});
</script>
</body>
</html>
