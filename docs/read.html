uls and a prince: Prince George of Greece was High Commissioner, living in Halepa, the district east of the old town. Eleftherios Venizelos, born in 1864 at Mournies just outside Chania, was a local lawyer-politician who led the Theriso revolt in 1905 against Prince George's rule, and in 1910 went to Athens and became Prime Minister of Greece. A rebel turned prime minister is a good story, but the more useful point for a household is that his career shows what it took to change who made the rules.\n\nThe decisive date is 1 December 1913. Under the Treaty of London of 30 May 1913, the Ottoman Empire gave up its rights to Crete, and on this fortress the Greek flag was raised. King Constantine and Venizelos attended. Three days later, on 4 December, Venizelos opened the new Municipal Market, which you saw this morning. The order is telling: first the flag, then the shops. A fresh political identity needed a modern place to buy cheese and fish.\n\nWhat changed for whom? For Orthodox families, the end of Ottoman rule meant an end to second-class status. For Cretan Muslims, it began the last years before the 1923 exchange. And for the city, the capital stayed here until 1971, when it moved to Heraklion.\n\nNow go into the museum if the weather is bad, because that is what it is for. The Bronze Age room has models of Minoan ships and finds from underwater archaeology. Look for the Venetian galleys, and the section on traditional boatbuilding: caiques, nets, tools. These show how a fishing or boatbuilding family made a living, which is the daily reality under all the flags. The Battle of Crete gallery in particular is about civilians as much as soldiers, since Cretan villagers fought paratroopers with whatever they had. Entry is 4 euros, and it closes at 17:00.\n\nWhen you come out, walk about 5 minutes south, away from the water, into Topanas. That was the Venetian nobles' quarter and later the Christian quarter, and just beyond it is the old Jewish quarter, Evraiki."},{"n":9,"slug":"synagogue","title":"The Courtyard of Evraiki","short":"You are in the lanes of Evraiki, the old Jewish quarter, at the Etz Hayyim synagogue on Parodos Kondylaki. It began as a Venetian church and became a synagogue in the 17th century, and a community prayed, studied and lived in these lanes for centuries beside Christian and Muslim neighbours. In May 1944 the Germans arrested Chania's Jews, about 250 to 275 people; on 9 June the ship carrying them, the Tanais, was sunk by a British submarine that did not know who was aboard. The building was restored and reopened in 1999. It is open until 15:00 today (4 euros, with a short tour). Photograph the building only, please. Lunch is two minutes away at Tamam.","long":"You are at Etz Hayyim, on Parodos Kondylaki, in the streets of Evraiki, the Jewish quarter of Chania. Please be quiet and unhurried here. It is open today until 15:00; entry is 4 euros, which includes a short tour with the staff, and they ask that you photograph the building only, with no selfies. I would take the tour if you can.\n\nThe building began as a church in the Venetian period and became a synagogue in the 17th century, after the Ottoman conquest. A Jewish community lived in this quarter under the Venetians and under the Ottomans. It was a Romaniote community, one of the Greek-speaking Jewish traditions, and its roots on Crete are described as going back to antiquity. I will keep to what is documented, and to what the place itself shows. A synagogue like this is not only a room for prayer; in a small quarter it is usually also where the community gathers for the big moments of life. Here, a courtyard, a garden and a mikveh, the ritual bath, are part of the place, which tells you it was a house of daily life as well as worship.\n\nWhat is striking, and what the visit shows you, is how normal it was. For centuries Jewish families in Chania lived in a mixed town, a few streets away from Splantzia's Muslim quarter and Topanas's Christian one, trading in the same markets, speaking the same Greek, and keeping their own calendar of festivals.\n\nOn 29 May 1944, during the German occupation, soldiers rounded up the Jews of Chania, about 250 to 275 people. (Another account gives 276 arrested on 20 May; sources differ on the exact date and number.) They were taken by truck to Heraklion and put on board a ship, the Tanais, together with Greek hostages and resistance prisoners and Italian prisoners of war. On 9 June 1944 the British submarine HMS Vivid fired four torpedoes at about 2,400 yards. Two hit, and the ship sank in about 12 seconds, north-west of the islet of Dia. The crew of the Vivid did not know who was aboard. Estimates of the dead run from 425 to 1,000; about 265 of them were Cretan Jews. This ended Crete's Jewish community. The Tanais had been sunk once before, by the Luftwaffe in Souda Bay in May 1941, then raised and repaired. A memorial to the victims stands in Chania, and the town marks the anniversary each June.\n\nAfter the war the synagogue was a ruin. It was restored in the late 1990s, with Nikos Stavroulakis leading the work, and reopened in 1999. It was attacked by arsonists on 5 and 16 January 2010; the second fire destroyed about 2,500 rare books and manuscripts. It was repaired again. Today the congregation is mostly non-Jewish, following Sephardic customs and having written its own Haggadah; in effect, people who live here look after a house of prayer whose own community is gone. In 2006, Queen Sofia of Spain and the former King Constantine II visited unannounced.\n\nLook at the memorial plaque, if the guide shows it to you. It lists the deported families by name. In a day of cannon and flag, it is a reminder of what the other half of history looks like: not battles, but households, one by one.\n\nTake a moment in the courtyard. Then lunch: Tamam, on Zambeliou, is about two minutes away, in a former hammam (Ottoman bath), with Cretan-Ottoman cooking indoors, which suits this weather. After lunch, take a taxi east to the Archaeological Museum at Chalepa. It is about a 25-minute walk, so a taxi is kinder in the rain."},{"n":10,"slug":"museum","title":"The Ledger and the Hearth","short":"This is the Archaeological Museum of Chania at Skra 15, Chalepa, open 08:00 to 20:00 (15 euros with audio guide). It opened in 2022, and its best pieces are small. Look for the Master Impression, a tiny clay sealing from Kastelli, and the tablets: Linear A accounts and a Linear B tablet recording honey for Zeus and Dionysos. Those are household and temple bookkeeping. Look too for the painted clay coffin from Armeni (a cemetery near Rethymno) and the everyday Minoan pottery. This is the thread of the whole day: people kept stores, counted them and fed their gods. Take a taxi back to Souda in time for the ship by 18:00.","long":"You are at the Archaeological Museum of Chania, at Skra 15 in Chalepa. It opened in April 2022, replacing the old museum in the Venetian church of San Francesco in the old town, and it is open 08:00 to 20:00, with entry at 15 euros including an audio guide. If you are wet and tired, you have chosen well. Check the floor plan as you arrive, since the rooms may be arranged differently from what I describe.\n\nStart with the thing you stood above this morning: the Minoan town on Kastelli hill. The best pieces here are small, and almost all of them are about managing a household. Look for the sealings, lumps of clay stamped with a seal. They were pressed onto jar stoppers, boxes and doors, so that anyone opening a storeroom had to break the seal; the excavation turned up a clay bar bearing twelve seal impressions from ten different seals. That is bureaucracy in clay. And then look for the Master Impression itself: the tiny sealing, a few centimetres across, showing a tall figure over a walled, multi-storey town by the sea. The gold ring that made it has never been found. Whether the figure is a ruler, a god or a ruler shown as divine is argued over, and I would not pretend to settle it.\n\nThen the tablets. Kydonia produced something like 97 to 99 Linear A tablets, the second-largest archive of that script after Hagia Triada, mostly records of farm produce and livestock. They survive because the fire around 1450 BC baked them hard. No one can read Linear A as language; we can read the numbers and some commodity signs, so we can follow the accounts without knowing the words. If it is on display, look also for the Linear B tablet recording honey: roughly \"to Zeus, honey\", one amphora, and \"to Dionysos, honey\", two. It is about 800 years older than classical Greek drama, and religion appears as a line in the household budget, written on the same kind of clay as sheep and wool. The idea that it proves Dionysos was already Zeus's son is an inference, and debated.\n\nThink back to the kitchen you saw through the fence: a clay hearth with a loom right beside it, and a jar holding about 3 kilograms of burnt lentils and vetch. Put the three together and you have a household: the hearth, the cloth, and the clerk upstairs counting. In Linear B records from Knossos, textile workers appear by name, women and children among them, on ration lists. Women's work was real and measured. Whether women held political power is unknown; the \"matriarchy\" idea is a modern projection, not evidence.\n\nLook for the larnakes, painted clay coffins. One is decorated with a hunting scene. It comes from a cemetery at Armeni, near Rethymno, not Chania, which is why I am telling you. They date to 1400 to 1200 BC. Look for pottery, too: the \"Kydonia workshop\" wares of the 13th century BC, and large inscribed stirrup jars, oil or wine jars painted in Linear B, which clay analysis traces to west Crete; some turned up at Thebes. A jar like that is the Bronze Age equivalent of a shipping label. Then find the later cities, Greek and Roman Kydonia. Layers are the point.\n\nChalepa itself is a final lesson. In the Cretan State, from 1898 to 1913, this eastern district was where consuls and the prince's court lived, and the Venizelos house is here. The old town's harbour had galleys, then a garrison; Chalepa had a tidy world of diplomats and lawyers' households. Every era arranged its people differently, and each left a ledger of sorts.\n\nSo the day closes where it began: with the people under the hill, who counted their oil, wove their wool and gave honey to the gods. The Venetians built their shipyards, the Ottomans their mosques, the town its market and its synagogue, and underneath them the same questions about storage, work and neighbours kept coming round.\n\nTo go home, a taxi from here to Souda is the easiest way to be back on the ship before 18:00. Allow plenty of time in the rain, and give yourself a margin."}]};
const PLACES = {"souda":"Souda Bay (the cruise quay)","agora":"Market Hall (Agora), the shuttle end","splantzia":"Splantzia: Plateia 1821 and Agios Nikolaos","kastelli":"Kastelli hill: Minoan Kydonia","neoria":"The Venetian shipyards (Neoria) and the ship Minoa","lighthouse":"The lighthouse","mosque":"Kioutsouk Hasan mosque (Yiali Tzamisi)","firkas":"Firkas fortress and the Maritime Museum of Crete","synagogue":"Etz Hayyim synagogue","museum":"Archaeological Museum of Chania (Chalepa)"};
const NAMES = {rob:'Rob', jamie:'Jamie'};
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const FS = [15,16,17,18,19,20,22,24,26,28];
let who='rob', idx=0, len='long';
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pressed(sel,attr,val){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String((b.dataset[attr]||'')===val)));}
function applyFont(){const fs=Number(store.get('chaniaFont',19));document.documentElement.style.setProperty('--fs',fs+'px');document.getElementById('fsdown').disabled=fs<=FS[0];document.getElementById('fsup').disabled=fs>=FS[FS.length-1];}
function stepFont(d){const fs=Number(store.get('chaniaFont',19));let i=FS.indexOf(fs);if(i<0)i=4;i=Math.max(0,Math.min(FS.length-1,i+d));store.set('chaniaFont',FS[i]);applyFont();}
function applyTheme(){const t=store.get('chaniaTheme','');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');pressed('.sheet [data-theme]','theme',t);}
function setLen(l){len=l;store.set('chaniaLen',l);pressed('.bar [data-len]','len',l);render();}
function parseHash(){const m=location.hash.match(/^#(rob|jamie)(?:\/([a-z0-9-]+))?/);if(m){who=m[1];const k=m[2]||'';const bySlug=STOPS[who].findIndex(s=>s.slug===k);idx=bySlug>=0?bySlug:(/^\d+$/.test(k)?Math.max(0,Math.min(STOPS[who].length-1,Number(k)-1)):Number(store.get('chaniaPos:'+who,0))||0);return;}const q=new URLSearchParams(location.search).get('as');who=(q==='jamie'||q==='rob')?q:store.get('chaniaWho','rob');if(!(who in STOPS))who='rob';idx=Number(store.get('chaniaPos:'+who,0))||0;}
function go(w,i,opts){opts=opts||{};if(!STOPS[w]||!STOPS[w].length){document.getElementById('main').innerHTML='<p>The stops have not loaded. Pull down to reload.</p>';return;}who=w;idx=Math.max(0,Math.min(STOPS[w].length-1,i));store.set('chaniaPos:'+w,idx);store.set('chaniaWho',w);const h='#'+w+'/'+STOPS[w][idx].slug;if(opts.push===false)history.replaceState(null,'',h);else history.pushState(null,'',h);render();window.scrollTo(0,0);}
function num(s){return String(s.n).padStart(2,'0');}
function words(t){return (t||'').split(/\s+/).filter(Boolean).length;}
function render(){
  const list=STOPS[who], s=list[idx];
  document.getElementById('whoname').textContent=NAMES[who];
  document.getElementById('mapbtn').href='index.html#at/'+s.slug;
  document.title=`${num(s)} ${s.title} · ${NAMES[who]} · Chania Landfall`;
  const text=len==='short'?s.short:s.long;
  const head=`<div class="eyebrow">${NAMES[who]}'s track · stop ${s.n} of ${list.length} · ${len==='short'?'short':'long'} · ${Math.max(1,Math.round(words(text)/200))} min read</div><h1>${esc(s.title)}</h1>${PLACES[s.slug]?`<p class="place">${esc(PLACES[s.slug])}</p>`:''}`;
  const body=text.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
  const foot=`<div class="foot ui"><button type="button" id="prev" ${idx===0?'disabled':''}>‹ ${idx>0?esc(list[idx-1].title):'Start'}</button><button type="button" id="next" ${idx===list.length-1?'disabled':''}>${idx<list.length-1?esc(list[idx+1].title):'End'} ›</button></div>`;
  document.getElementById('main').innerHTML=head+body+foot;
  document.getElementById('prev').onclick=()=>go(who,idx-1);
  document.getElementById('next').onclick=()=>go(who,idx+1);
  pressed('.sheet [data-who]','who',who);
  buildToc();
}
function buildToc(){const ol=document.getElementById('toc');ol.innerHTML='';document.getElementById('sheettitle').textContent=NAMES[who]+"'s track";STOPS[who].forEach((s,i)=>{const li=document.createElement('li');li.setAttribute('aria-current',String(i===idx));li.innerHTML=`<button type="button"><span class="n">${num(s)}</span><span class="t">${esc(s.title)}</span><span class="d">${Math.max(1,Math.round(words(s.long)/200))} min</span></button>`;li.querySelector('button').onclick=()=>{closeSheet();go(who,i);};ol.appendChild(li);});}
function openSheet(){buildToc();document.getElementById('sheet').hidden=false;}
function closeSheet(){document.getElementById('sheet').hidden=true;}
document.getElementById('tocbtn').onclick=openSheet;
document.getElementById('closesheet').onclick=closeSheet;
document.getElementById('fsdown').onclick=()=>stepFont(-1);
document.getElementById('fsup').onclick=()=>stepFont(1);
document.querySelectorAll('.bar [data-len]').forEach(b=>b.onclick=()=>setLen(b.dataset.len));
document.querySelectorAll('.sheet [data-who]').forEach(b=>b.onclick=()=>{const w=b.dataset.who;closeSheet();go(w,Number(store.get('chaniaPos:'+w,0))||0);});
document.querySelectorAll('.sheet [data-theme]').forEach(b=>b.onclick=()=>{store.set('chaniaTheme',b.dataset.theme||'');applyTheme();});
window.addEventListener('popstate',()=>{parseHash();render();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(who,idx+1);if(e.key==='ArrowLeft')go(who,idx-1);});
let tx=null,ty=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=ty=null;if(!document.getElementById('sheet').hidden)return;if(Math.abs(dx)>90&&Math.abs(dy)<60){if(dx<0)go(who,idx+1);else go(who,idx-1);}},{passive:true});
applyFont();applyTheme();
len=store.get('chaniaLen','long');pressed('.bar [data-len]','len',len);
parseHash();
go(who,idx,{push:false});
</script>
</body>
</html>
